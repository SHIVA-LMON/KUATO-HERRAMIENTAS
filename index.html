function initApp(){
  // Check ?admin=1 param
  if(urlParams.get('admin')==='1'){
    isAdmin=true;
    document.getElementById('adminBadge').style.display='';
    renderHome();
    return;
  }
  // Check sessionStorage for saved maestro
  try{
    const saved=sessionStorage.getItem('kuato_maestro');
    if(saved){
      currentMaestro=JSON.parse(saved);
      // Verify not expired
      if(currentMaestro.expiresAt && currentMaestro.expiresAt>0 && Date.now()>currentMaestro.expiresAt){
        sessionStorage.removeItem('kuato_maestro');
        currentMaestro=null;
        renderLoginScreen();
        return;
      }
      renderMaestroHome(currentMaestro);
      return;
    }
  }catch(e){}
  // Show login
  renderLoginScreen();
}

function renderLoginScreen(){
  pushNav({screen:'login'});
  clearRoot();
  const r=root();

  const wrap=el('div',{class:'new-login'});
  const logo=el('div',{class:'new-login-logo brand'});
  logo.appendChild(document.createTextNode('KUATO '));
  logo.appendChild(el('span',{},'Herramientas'));
  wrap.appendChild(logo);
  wrap.appendChild(el('div',{class:'new-login-sub'},['Plataforma de herramientas didácticas']));

  const roleCards=el('div',{class:'role-cards'});
  const formBox=el('div',{class:'login-form-box',style:'display:none;'});

  function makeRoleCard(emoji, label, path){
    const card=el('div',{class:'role-card'});
    card.appendChild(el('div',{class:'rc-icon'},[emoji]));
    card.appendChild(el('div',{class:'rc-label'},[label]));
    card.addEventListener('click',()=>{
      roleCards.querySelectorAll('.role-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      showForm(path);
    });
    return card;
  }
  roleCards.appendChild(makeRoleCard('👩‍🏫','Soy Maestro','maestro'));
  roleCards.appendChild(makeRoleCard('👩‍💼','Soy Admin','admin'));
  roleCards.appendChild(makeRoleCard('🎓','Soy Alumno','alumno'));
  wrap.appendChild(roleCards);

  function showForm(path){
    formBox.style.display='';
    formBox.innerHTML='';
    if(path==='alumno'){
      formBox.appendChild(el('div',{style:'font-size:14px;font-weight:700;color:var(--navy);margin-bottom:12px;'},['Ingresa el código de la actividad:']));
      const codeIn=el('input',{type:'text',maxlength:'5',placeholder:'XXXXX',style:'width:100%;padding:14px;border:1px solid var(--border-strong);border-radius:8px;font-size:22px;letter-spacing:6px;text-transform:uppercase;font-family:monospace;text-align:center;margin-bottom:12px;'});
      formBox.appendChild(codeIn);
      const err=el('div',{class:'err',style:'display:none;margin-bottom:8px;'});
      formBox.appendChild(err);
      const btn=el('button',{class:'btn btn-primary btn-full',style:'font-size:16px;padding:14px;'},'Entrar');
      btn.addEventListener('click',()=>{
        const code=codeIn.value.trim().toUpperCase();
        if(code.length!==5){err.textContent='Escribe un código de 5 caracteres.';err.style.display='';return;}
        err.style.display='none';
        joinWithCode(code);
      });
      codeIn.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
      formBox.appendChild(btn);
    } else {
      const userFld=el('div',{class:'field'});
      userFld.appendChild(el('label',{},'Usuario'));
      const userIn=el('input',{type:'text',placeholder:'Usuario'});
      userFld.appendChild(userIn);
      formBox.appendChild(userFld);
      const passFld=el('div',{class:'field'});
      passFld.appendChild(el('label',{},'Contraseña'));
      const passIn=el('input',{type:'password',placeholder:'Contraseña'});
      passFld.appendChild(passIn);
      formBox.appendChild(passFld);
      const err=el('div',{class:'err',style:'display:none;'});
      formBox.appendChild(err);
      const btn=el('button',{class:'btn btn-primary btn-full',style:'margin-top:8px;'},path==='admin'?'Acceder al panel':'Entrar');
      btn.addEventListener('click',async()=>{
        const user=userIn.value.trim(), pass=passIn.value.trim();
        if(!user||!pass){err.textContent='Completa todos los campos.';err.style.display='';return;}
        if(path==='admin'){
          if(user==='kuato'&&pass==='admin2024'){
            isAdmin=true;
            document.getElementById('adminBadge').style.display='';
            renderAdminPanel();
          } else { err.textContent='Credenciales incorrectas.';err.style.display=''; }
          return;
        }
        // maestro
        btn.textContent='Verificando...';btn.disabled=true;
        try{
          // Check hardcoded admin as maestro
          if(user==='kuato'&&pass==='admin2024'){
            isAdmin=true;
            document.getElementById('adminBadge').style.display='';
            renderHome();
            return;
          }
          const snap=await db.collection('kuato_herramientas').doc('admin_data').get();
          if(!snap.exists){err.textContent='No hay maestros registrados.';err.style.display='';btn.textContent='Entrar';btn.disabled=false;return;}
          const maestros=snap.data().maestros||[];
          const found=maestros.find(m=>m.username===user&&m.password===pass);
          if(!found){err.textContent='Usuario o contraseña incorrectos.';err.style.display='';btn.textContent='Entrar';btn.disabled=false;return;}
          if(found.expiresAt&&found.expiresAt>0&&Date.now()>found.expiresAt){
            err.textContent='Tu cuenta ha expirado.';err.style.display='';btn.textContent='Entrar';btn.disabled=false;return;
          }
          currentMaestro=found;
          try{sessionStorage.setItem('kuato_maestro',JSON.stringify(found));}catch(e){}
          renderMaestroHome(found);
        }catch(e){err.textContent='Error al verificar.';err.style.display='';btn.textContent='Entrar';btn.disabled=false;}
      });
      passIn.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
      userIn.addEventListener('keydown',e=>{if(e.key==='Enter')passIn.focus();});
      formBox.appendChild(btn);
    }
  }

  wrap.appendChild(formBox);
  r.appendChild(wrap);
}

function renderAdminPanel(){
  clearRoot();
  removeChatWidget();
  const r=root();

  r.appendChild(el('div',{class:'home-title'},[el('h1',{class:'brand'},['Panel de Administración'])]));

  const ALL_TOOLS=ALL_CATEGORIES.flatMap(c=>c.tools);

  // Add maestro section
  const addSection=el('div',{class:'admin-section'});
  addSection.appendChild(el('h2',{},'Agregar maestro'));

  const usernameF=el('div',{class:'field'});
  usernameF.appendChild(el('label',{},'Nombre de usuario'));
  const usernameIn=el('input',{type:'text',placeholder:'usuario'});
  usernameF.appendChild(usernameIn);
  addSection.appendChild(usernameF);

  const passF=el('div',{class:'field'});
  passF.appendChild(el('label',{},'Contraseña'));
  const passIn=el('input',{type:'text',placeholder:'contraseña'});
  passF.appendChild(passIn);
  addSection.appendChild(passF);

  const expF=el('div',{class:'field'});
  expF.appendChild(el('label',{},'Fecha de expiración (vacío = sin expiración)'));
  const expIn=el('input',{type:'date'});
  expF.appendChild(expIn);
  addSection.appendChild(expF);

  const toolsF=el('div',{class:'field'});
  toolsF.appendChild(el('label',{},'Herramientas habilitadas'));
  const toolChecks={};
  const toolsGrid=el('div',{style:'display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;'});
  ALL_TOOLS.forEach(t=>{
    const lbl=el('label',{style:'display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;'});
    const chk=el('input',{type:'checkbox',checked:''});
    chk.checked=true;
    toolChecks[t.id]=chk;
    lbl.appendChild(chk);
    lbl.appendChild(document.createTextNode(t.icon+' '+t.name));
    toolsGrid.appendChild(lbl);
  });
  toolsF.appendChild(toolsGrid);
  addSection.appendChild(toolsF);

  const addErr=el('div',{class:'err',style:'display:none;'});
  addSection.appendChild(addErr);
  const addOk=el('div',{class:'ok',style:'display:none;'});
  addSection.appendChild(addOk);

  const addBtn=el('button',{class:'btn btn-primary'},'Agregar maestro');
  addBtn.addEventListener('click',async()=>{
    const username=usernameIn.value.trim();
    const password=passIn.value.trim();
    if(!username||!password){ addErr.textContent='Usuario y contraseña requeridos.'; addErr.style.display=''; addOk.style.display='none'; return; }
    const enabledTools=ALL_TOOLS.filter(t=>toolChecks[t.id].checked).map(t=>t.id);
    let expiresAt=0;
    if(expIn.value){
      expiresAt=new Date(expIn.value).getTime()+24*60*60*1000-1;
    }
    const newMaestro={id:'m_'+Date.now(),username,password,expiresAt,enabledTools};
    try{
      const snap=await db.collection('kuato_herramientas').doc('admin_data').get();
      const existing=snap.exists?(snap.data().maestros||[]):[];
      existing.push(newMaestro);
      await db.collection('kuato_herramientas').doc('admin_data').set({maestros:existing},{merge:true});
      addErr.style.display='none'; addOk.textContent='Maestro agregado.'; addOk.style.display='';
      usernameIn.value=''; passIn.value=''; expIn.value='';
      loadMaestroList();
    }catch(e){ addErr.textContent='Error al guardar.'; addErr.style.display=''; addOk.style.display='none'; }
  });

  chatRow.appendChild(chatSend);
  chatSection.appendChild(chatRow);

  async function sendAdminMsg(){
    const txt=chatIn.value.trim(); if(!txt) return;
    const snap=await db.collection('kuato_herramientas').doc('admin_data').get();
    const msgs=(snap.exists && snap.data().adminChat)||[];
    msgs.push({from:'admin',name:'Admin',text:txt,ts:Date.now()});
    await db.collection('kuato_herramientas').doc('admin_data').set({adminChat:msgs},{merge:true});
    chatIn.value='';
  }
  chatSend.addEventListener('click',sendAdminMsg);
  chatIn.addEventListener('keydown',e=>{ if(e.key==='Enter') sendAdminMsg(); });

  if(adminChatListener) adminChatListener();
  adminChatListener=db.collection('kuato_herramientas').doc('admin_data').onSnapshot(snap=>{
    if(!snap.exists) return;
    const msgs=snap.data().adminChat||[];
    const el2=document.getElementById('adminChatMsgs');
    if(!el2) return;
    el2.innerHTML='';
    if(msgs.length===0){ el2.appendChild(el('p',{class:'muted',style:'text-align:center;font-size:12px;'},'Sin mensajes.')); return; }

      msg.appendChild(document.createTextNode(m.text));
      el2.appendChild(msg);
    });

  });

  // Back / logout
  const backBtn=el('button',{class:'btn btn-outline',style:'margin-top:8px;'},'← Salir del panel');
  backBtn.addEventListener('click',()=>{
    isAdmin=false;

    renderLoginScreen();

}

function renderMisClases(r, maestro){
  const section=el('div',{class:'card',style:'margin-bottom:20px;'});
  const titleRow=el('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;'});
  titleRow.appendChild(el('div',{class:'section-title',style:'margin:0;border:none;padding:0;'},'🏫 Mis Clases'));
  const newBtn=el('button',{class:'btn btn-primary btn-sm'},'+ Nueva Clase');
  newBtn.addEventListener('click',()=>{
    showModal(box=>{
      box.appendChild(el('h2',{},'Crear nueva clase'));
      const f=el('div',{class:'field'});
      f.appendChild(el('label',{},'Nombre de la clase'));
      const nameIn=el('input',{type:'text',placeholder:'Ej. Matemáticas 3A'});
      f.appendChild(nameIn);
      box.appendChild(f);
      const err=el('div',{class:'err',style:'display:none;'});
      box.appendChild(err);
      const acts=el('div',{class:'modal-actions'});
      const cancelBtn=el('button',{class:'btn btn-outline'},'Cancelar');
      cancelBtn.addEventListener('click',closeModal);
      const createBtn=el('button',{class:'btn btn-primary'},'Crear');
      createBtn.addEventListener('click',async()=>{
        const name=nameIn.value.trim();
        if(!name){err.textContent='Escribe un nombre.';err.style.display='';return;}
        createBtn.textContent='Creando...';createBtn.disabled=true;
        const code=uid5();
        const claseData={name,maestro:maestro.username,code,createdAt:Date.now(),students:{},actividades:[],status:'active'};
        await db.collection('kuato_clases').doc(code).set(claseData);
        closeModal();
        renderClasePanel(code,claseData,maestro);
      });
      acts.appendChild(cancelBtn);
      acts.appendChild(createBtn);
      box.appendChild(acts);
      setTimeout(()=>nameIn.focus(),100);
    });
  });
  titleRow.appendChild(newBtn);
  section.appendChild(titleRow);

  const listEl=el('div',{id:'misClasesList'});
  listEl.appendChild(el('div',{class:'muted',style:'text-align:center;padding:12px;'},'Cargando clases...'));
  section.appendChild(listEl);
  r.appendChild(section);

  // Load classes for this maestro
  db.collection('kuato_clases').where('maestro','==',maestro.username).where('status','==','active').get().then(snap=>{
    listEl.innerHTML='';
    if(snap.empty){
      listEl.appendChild(el('div',{class:'muted',style:'text-align:center;padding:12px;'},'No tienes clases activas. Crea una nueva.'));
      return;
    }
    snap.forEach(doc=>{
      const d=doc.data();
      const card=el('div',{class:'clase-card'});
      const left=el('div',{});
      left.appendChild(el('div',{style:'font-weight:700;color:var(--navy);font-size:15px;'},[d.name]));
      left.appendChild(el('div',{class:'muted',style:'font-size:12px;margin-top:4px;'},[Object.keys(d.students||{}).length+' alumnos · '+((d.actividades||[]).length)+' actividades']));
      card.appendChild(left);
      card.appendChild(el('div',{class:'clase-code'},[d.code]));
      card.addEventListener('click',()=>renderClasePanel(doc.id,d,maestro));
      listEl.appendChild(card);
    });
  }).catch(()=>{
    listEl.innerHTML='';
    listEl.appendChild(el('div',{class:'err'},'Error al cargar clases.'));
  });
}

function renderClasePanel(claseCode, claseData, maestro){
  clearRoot();
  const r=root();

  const hdr=el('div',{class:'act-header'});
  hdr.appendChild(el('span',{class:'act-header-title'},['🏫 '+claseData.name]));
  hdr.appendChild(el('span',{class:'code-badge'},[claseCode]));
  r.appendChild(hdr);

  const backBtn=el('button',{class:'btn btn-outline btn-sm',style:'margin-bottom:16px;'},'← Mis Clases');
  backBtn.addEventListener('click',()=>renderMaestroHome(maestro));
  r.appendChild(backBtn);

  // Students
  const studCard=el('div',{class:'card',style:'margin-bottom:16px;'});
  studCard.appendChild(el('h3',{},'👥 Alumnos inscritos'));
  const students=claseData.students||{};
  const studNames=Object.keys(students);
  if(studNames.length===0){
    studCard.appendChild(el('div',{class:'muted'},'Ningún alumno aún. Comparte el código '+claseCode));
  } else {
    const chips=el('div',{class:'chip-list'});
    studNames.forEach(n=>chips.appendChild(el('span',{class:'participant-chip'},[n])));
    studCard.appendChild(chips);
  }
  r.appendChild(studCard);

  // Activities
  const actCard=el('div',{class:'card'});
  const actTitleRow=el('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;'});
  actTitleRow.appendChild(el('h3',{style:'margin:0;'},'📋 Actividades'));
  const newActBtn=el('button',{class:'btn btn-primary btn-sm'},'+ Abrir Actividad');
  newActBtn.addEventListener('click',()=>{
    showModal(box=>{
      box.appendChild(el('h2',{},'Abrir nueva actividad'));
      const f=el('div',{class:'field'});
      f.appendChild(el('label',{},'Herramienta'));
      const sel=el('select',{});
      ALL_CATEGORIES.flatMap(c=>c.tools).forEach(t=>{
        sel.appendChild(el('option',{value:t.id},[t.icon+' '+t.name]));
      });
      f.appendChild(sel);
      box.appendChild(f);
      const acts2=el('div',{class:'modal-actions'});
      const cancelBtn=el('button',{class:'btn btn-outline'},'Cancelar');
      cancelBtn.addEventListener('click',closeModal);
      const openBtn=el('button',{class:'btn btn-primary'},'Abrir');
      openBtn.addEventListener('click',async()=>{
        const toolId=sel.value;
        openBtn.textContent='Abriendo...';openBtn.disabled=true;
        const actCode=uid5();
        const actData={tool:toolId,code:actCode,status:'waiting',createdAt:Date.now(),items:[],history:[],participants:{}};
        sessionDoc=db.collection('kuato_juegos').doc(actCode);
        await sessionDoc.set(actData);
        const actividad={id:actCode,toolId,name:toolNames[toolId]||toolId,openedAt:Date.now(),closedAt:null,status:'open',results:[]};
        const existingActs=(claseData.actividades||[]).slice();
        existingActs.push(actividad);
        await db.collection('kuato_clases').doc(claseCode).update({actividades:existingActs});
        claseData.actividades=existingActs;
        closeModal();
        currentCode=actCode;currentTool=toolId;currentRole='host';
        renderHostSetup(toolId,actCode);
      });
      acts2.appendChild(cancelBtn);
      acts2.appendChild(openBtn);
      box.appendChild(acts2);
    });
  });
  actTitleRow.appendChild(newActBtn);
  actCard.appendChild(actTitleRow);

  const actividades=claseData.actividades||[];
  if(actividades.length===0){
    actCard.appendChild(el('div',{class:'muted'},'Sin actividades todavía.'));
  } else {
    actividades.slice().reverse().forEach(act=>{
      const row=el('div',{style:'display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;'});
      const info=el('div',{});
      info.appendChild(el('div',{style:'font-weight:700;font-size:14px;'},[toolNames[act.toolId]||act.toolId]));
      info.appendChild(el('div',{class:'muted',style:'font-size:12px;'},[act.id+' · '+(act.status==='open'?'Abierta':'Cerrada')]));
      row.appendChild(info);
      if(act.status==='open'){
        const closeBtn=el('button',{class:'btn btn-danger btn-sm'},'Cerrar');
        closeBtn.addEventListener('click',async()=>{
          const newActs=(claseData.actividades||[]).map(a=>a.id===act.id?{...a,status:'closed',closedAt:Date.now()}:a);
          await db.collection('kuato_clases').doc(claseCode).update({actividades:newActs});
          await db.collection('kuato_juegos').doc(act.id).update({status:'finished'});
          claseData.actividades=newActs;
          renderClasePanel(claseCode,claseData,maestro);
        });
        row.appendChild(closeBtn);
      }
      actCard.appendChild(row);
    });
  }
  r.appendChild(actCard);
}

function renderClaseStudentView(code, claseData, studentName){
  clearRoot();
  const r=root();
  r.appendChild(el('div',{class:'waiting-screen',style:'padding-bottom:0;'},[
    el('div',{class:'wt-label'},['Hola, '+studentName]),
    el('div',{style:'font-size:22px;font-weight:700;color:var(--navy);'},[claseData.name]),
    el('div',{class:'muted',style:'margin-top:8px;font-size:13px;'},'Las actividades abiertas apareceran aquí'),
  ]));

  const actsWrap=el('div',{style:'max-width:400px;margin:24px auto 0;'});
  r.appendChild(actsWrap);

  // Real-time listener for open activities
  const claseRef=db.collection('kuato_clases').doc(code);
  sessionListener=claseRef.onSnapshot(snap=>{
    if(!snap.exists) return;
    const d=snap.data();
    const openActs=(d.actividades||[]).filter(a=>a.status==='open');
    actsWrap.innerHTML='';
    if(openActs.length===0){
      actsWrap.appendChild(el('div',{class:'muted',style:'text-align:center;padding:20px;'},'No hay actividades abiertas en este momento.'));
    } else {
      openActs.forEach(act=>{
        const tile=el('div',{class:'clase-student-activity'});
        tile.appendChild(el('div',{class:'act-icon'},[act.toolId==='quiz'?'⏱️':act.toolId==='quiz_interactivo'?'❓':act.toolId==='encuesta'?'📊':act.toolId==='orden'?'🔢':act.toolId==='plano'?'📐':act.toolId==='participacion'?'✋':'🎯']));
        tile.appendChild(el('div',{class:'act-name'},[act.name]));
        tile.addEventListener('click',async()=>{
          const gameSnap=await db.collection('kuato_juegos').doc(act.id).get();
          if(!gameSnap.exists){alert('Esta actividad no está disponible.');return;}
          const gameData=gameSnap.data();
          if(gameData.status==='finished'){alert('Esta actividad ya terminó.');return;}
          currentCode=act.id;currentTool=act.toolId;currentRole='guest';
          sessionDoc=db.collection('kuato_juegos').doc(act.id);
          await sessionDoc.update({[`participants.${studentName}`]:{joinedAt:Date.now()}});
          if(act.toolId==='quiz') renderGuestQuiz(act.id,gameData,studentName);
          else if(act.toolId==='quiz_interactivo') renderGuestQuizInteractivo(act.id,gameData,studentName);
          else if(act.toolId==='plano') renderGuestPlano(act.id,gameData,studentName);
          else if(act.toolId==='orden') renderGuestOrden(act.id,gameData,studentName);
          else if(act.toolId==='encuesta') renderGuestSurvey(act.id,gameData,studentName);
          else if(act.toolId==='participacion') renderGuestParticipacion(act.id,gameData);
          else if(act.toolId==='marcador') renderGuestMarcadorEntry(act.id,gameData);
          else renderGuestViewer(act.toolId,act.id,gameData);
        });
        actsWrap.appendChild(tile);
      });
    }
  });
}

async function saveClaseActivityResults(claseCode, actividadId, results){

}

function renderQuizInteractivoEditor(code){

  hdr.appendChild(el('span',{class:'act-header-title'},['❓ Quiz Interactivo']));

  r.appendChild(hdr);

  const questions=[];
  const qListEl=el('div',{id:'qiQuestionList'});
  r.appendChild(qListEl);

  function renderQList(){
    qListEl.innerHTML='';
    questions.forEach((q,i)=>{
      const qCard=el('div',{class:'card',style:'position:relative;'});
      const delBtn=el('button',{class:'btn btn-sm btn-danger',style:'position:absolute;top:12px;right:12px;'},'✕');

      qCard.appendChild(el('div',{class:'muted',style:'font-size:12px;'},[q.type==='multiple'?'Opción múltiple ('+q.options.length+' opciones)':'Respuesta abierta']));
      qListEl.appendChild(qCard);
    });
  }

  // Add question form
  const addCard=el('div',{class:'card'});
  addCard.appendChild(el('h3',{},'Agregar pregunta'));

  const tf=el('div',{class:'field'});
  tf.appendChild(el('label',{},'Texto de la pregunta'));

  addCard.appendChild(tf);

  const typef=el('div',{class:'field'});
  typef.appendChild(el('label',{},'Tipo'));
  const typesel=el('select',{});
  typesel.appendChild(el('option',{value:'multiple'},'Opción múltiple'));
  typesel.appendChild(el('option',{value:'open'},'Respuesta abierta'));
  typef.appendChild(typesel);
  addCard.appendChild(typef);

  const optionsWrap=el('div',{id:'qiOptionsWrap'});
  addCard.appendChild(optionsWrap);

  let optionsList=[{text:'',correct:true},{text:'',correct:false},{text:'',correct:false},{text:'',correct:false}];

  function renderOptions(){
    optionsWrap.innerHTML='';
    if(typesel.value==='open'){
      const of=el('div',{class:'field'});
      of.appendChild(el('label',{},'Respuesta correcta (para comparar)'));
      const oi=el('input',{type:'text',placeholder:'Respuesta esperada',id:'qiOpenAnswer'});
      of.appendChild(oi);
      optionsWrap.appendChild(of);
      return;
    }
    optionsList.forEach((opt,oi)=>{
      const row=el('div',{style:'display:flex;align-items:center;gap:8px;margin-bottom:8px;'});
      const radio=el('input',{type:'radio',name:'qiCorrect'+(Math.random())});
      radio.checked=opt.correct;
      radio.addEventListener('change',()=>{optionsList.forEach((_,j)=>optionsList[j].correct=j===oi);});
      const inp=el('input',{type:'text',placeholder:'Opción '+(oi+1),style:'flex:1;padding:8px;border:1px solid var(--border-strong);border-radius:6px;font-size:14px;font-family:inherit;'});
      inp.value=opt.text;
      inp.addEventListener('input',()=>{optionsList[oi].text=inp.value;});
      const del2=el('button',{class:'btn btn-sm btn-danger'},'✕');
      del2.addEventListener('click',()=>{optionsList.splice(oi,1);renderOptions();});
      row.appendChild(radio);
      row.appendChild(inp);
      row.appendChild(del2);
      optionsWrap.appendChild(row);
    });
    const addOptBtn=el('button',{class:'btn btn-outline btn-sm',style:'margin-top:4px;'},'+ Opción');
    addOptBtn.addEventListener('click',()=>{optionsList.push({text:'',correct:false});renderOptions();});
    optionsWrap.appendChild(addOptBtn);
  }

  typesel.addEventListener('change',renderOptions);
  renderOptions();

  const addQErr=el('div',{class:'err',style:'display:none;'});
  addCard.appendChild(addQErr);
  const addQBtn=el('button',{class:'btn btn-outline',style:'margin-top:8px;'},'+ Agregar pregunta');
  addQBtn.addEventListener('click',()=>{
    const text=tIn.value.trim();
    if(!text){addQErr.textContent='Escribe el texto.';addQErr.style.display='';return;}
    if(typesel.value==='multiple'){
      const filled=optionsList.filter(o=>o.text.trim());
      if(filled.length<2){addQErr.textContent='Agrega al menos 2 opciones.';addQErr.style.display='';return;}
      const hasCorrect=optionsList.some(o=>o.correct&&o.text.trim());
      if(!hasCorrect){addQErr.textContent='Marca una opción correcta.';addQErr.style.display='';return;}
      questions.push({text,type:'multiple',options:optionsList.filter(o=>o.text.trim()).map(o=>({text:o.text.trim(),correct:o.correct})),points:10});
    } else {
      const correctText=(document.getElementById('qiOpenAnswer')||{value:''}).value.trim();
      questions.push({text,type:'open',correctText,points:10});
    }
    tIn.value='';
    optionsList=[{text:'',correct:true},{text:'',correct:false},{text:'',correct:false},{text:'',correct:false}];
    renderOptions();
    addQErr.style.display='none';
    renderQList();
  });
  addCard.appendChild(addQBtn);
  r.appendChild(addCard);
  renderQList();

  const startErr=el('div',{class:'err',style:'display:none;margin-top:8px;'});
  const startBtn=el('button',{class:'btn btn-primary',style:'margin-top:16px;width:100%;font-size:16px;padding:14px;'},'▶ Comenzar Quiz');
  startBtn.addEventListener('click',async()=>{
    if(questions.length===0){startErr.textContent='Agrega al menos una pregunta.';startErr.style.display='';return;}
    startErr.style.display='none';
    startBtn.textContent='Iniciando...';startBtn.disabled=true;
    await db.collection('kuato_juegos').doc(code).update({
      tool:'quiz_interactivo',questions,currentQ:0,status:'active',answers:{},scores:{}
    });
    renderQuizInteractivoHost(code);
  });
  r.appendChild(startErr);
  r.appendChild(startBtn);
}

function renderQuizInteractivoHost(code){
  clearRoot();
  const r=root();

  const hdr=el('div',{class:'act-header'});
  hdr.appendChild(el('span',{class:'act-header-title'},['❓ Quiz Interactivo']));
  hdr.appendChild(el('span',{class:'code-badge'},[code]));
  r.appendChild(hdr);

  const contentWrap=el('div',{});
  r.appendChild(contentWrap);

  sessionListener=db.collection('kuato_juegos').doc(code).onSnapshot(snap=>{
    if(!snap.exists) return;
    const d=snap.data();
    const questions=d.questions||[];
    const curIdx=d.currentQ||0;
    const status=d.status||'active';
    const answers=d.answers||{};
    const scores=d.scores||{};
    contentWrap.innerHTML='';

    if(status==='finished'){
      // Final scoreboard
      contentWrap.appendChild(el('div',{class:'section-title',style:'text-align:center;'},'🏆 Resultados Finales'));
      const maxScore=questions.reduce((s,q)=>s+(q.points||10),0)||1;
      const entries=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
      if(entries.length===0){
        contentWrap.appendChild(el('div',{class:'muted',style:'text-align:center;padding:20px;'},'Nadie respondió.'));
      } else {
        entries.forEach(([name,score],i)=>{
          const sc=el('div',{class:'qi-score-card',style:i===0?'':'opacity:0.85;'});
          sc.appendChild(el('div',{style:'font-size:14px;margin-bottom:4px;'},[(i+1)+'. '+name]));
          sc.appendChild(el('div',{class:'qi-score-big'},[Math.round(score/maxScore*100)+'/100']));
          sc.appendChild(el('div',{style:'font-size:12px;opacity:0.7;'},[score+' pts de '+maxScore]));
          contentWrap.appendChild(sc);
        });
      }
      const backBtn=el('button',{class:'btn btn-outline',style:'margin-top:16px;'},'← Volver al inicio');
      backBtn.addEventListener('click',()=>renderHome());
      contentWrap.appendChild(backBtn);
      return;
    }

    if(curIdx>=questions.length){
      // All questions done
      const finBtn=el('button',{class:'btn btn-primary btn-full',style:'font-size:16px;padding:14px;margin-top:16px;'},'Finalizar y ver resultados');
      finBtn.addEventListener('click',async()=>{
        await db.collection('kuato_juegos').doc(code).update({status:'finished'});
      });
      contentWrap.appendChild(finBtn);
      return;
    }

    const q=questions[curIdx];
    const qAnswers=answers[curIdx]||{};
    const participants=d.participants||{};

    contentWrap.appendChild(el('div',{class:'qi-progress'},[
      'Pregunta '+(curIdx+1)+' de '+questions.length,
      Object.keys(qAnswers).length+' respuestas'
    ]));
    contentWrap.appendChild(el('div',{class:'qi-question'},[q.text]));

    // Show who answered
    Object.keys(participants).forEach(name=>{
      const ans=qAnswers[name];
      const row=el('div',{class:'qi-answer-row '+(ans?( ans.correct?'correct':'wrong'):'waiting')});
      row.appendChild(el('span',{},[name]));
      row.appendChild(el('span',{},[ans?(ans.correct?'✅':'❌'):'⏳']));
      contentWrap.appendChild(row);
    });

    // Reveal/next button
    if(status==='reveal'){
      const nextBtn=el('button',{class:'btn btn-primary btn-full',style:'margin-top:16px;font-size:15px;padding:12px;'},[
        curIdx+1<questions.length?'Siguiente pregunta →':'Finalizar quiz'
      ]);
      nextBtn.addEventListener('click',async()=>{
        const nextIdx=curIdx+1;
        const updates={currentQ:nextIdx,status:'active'};
        if(nextIdx>=questions.length) updates.status='finished';
        await db.collection('kuato_juegos').doc(code).update(updates);
      });
      contentWrap.appendChild(nextBtn);
    } else {
      const revBtn=el('button',{class:'btn btn-yellow btn-full',style:'margin-top:16px;font-size:15px;padding:12px;'},'Terminar pregunta y mostrar resultados');
      revBtn.addEventListener('click',async()=>{
        await db.collection('kuato_juegos').doc(code).update({status:'reveal'});
      });
      contentWrap.appendChild(revBtn);
    }
  });
}

function renderGuestQuizInteractivo(code, data, name){
  clearRoot();
  const r=root();

  const hdr=el('div',{class:'act-header'});
  hdr.appendChild(el('span',{class:'act-header-title'},['❓ Quiz Interactivo']));
  hdr.appendChild(el('span',{class:'code-badge'},[code]));
  r.appendChild(hdr);

  const contentWrap=el('div',{});
  r.appendChild(contentWrap);

  let lastQIdx=-1;
  let answered=false;

  sessionListener=db.collection('kuato_juegos').doc(code).onSnapshot(snap=>{
    if(!snap.exists) return;
    const d=snap.data();
    const questions=d.questions||[];
    const curIdx=d.currentQ||0;
    const status=d.status||'active';
    const answers=d.answers||{};

    // Reset answered flag when question changes
    if(curIdx!==lastQIdx){ answered=false; lastQIdx=curIdx; }

    contentWrap.innerHTML='';

    if(status==='finished'){
      const scores=d.scores||{};
      const myScore=scores[name]||0;
      const maxScore=questions.reduce((s,q)=>s+(q.points||10),0)||1;
      const pct=Math.round(myScore/maxScore*100);
      const sc=el('div',{class:'qi-score-card'});
      sc.appendChild(el('div',{style:'font-size:14px;margin-bottom:8px;'},['Tu calificación, '+name]));
      sc.appendChild(el('div',{class:'qi-score-big'},[pct+'/100']));
      sc.appendChild(el('div',{style:'font-size:13px;opacity:0.7;margin-top:8px;'},[myScore+' de '+maxScore+' puntos']));
      contentWrap.appendChild(sc);
      return;
    }

    if(curIdx>=questions.length){
      contentWrap.appendChild(el('div',{class:'waiting-screen'},[
        el('div',{class:'big-emoji',style:'font-size:48px;margin-bottom:12px;'},'⏳'),
        el('div',{style:'font-size:16px;color:var(--navy);'},'Esperando resultados finales...')
      ]));
      return;
    }

    const q=questions[curIdx];
    const qAnswers=answers[curIdx]||{};
    const myAns=qAnswers[name];

    contentWrap.appendChild(el('div',{class:'qi-progress'},[
      'Pregunta '+(curIdx+1)+' de '+questions.length
    ]));
    contentWrap.appendChild(el('div',{class:'qi-question'},[q.text]));

    if(status==='reveal'||myAns){
      // Show result
      if(q.type==='multiple'){
        q.options.forEach(opt=>{
          const div=el('div',{class:'qi-option'+(opt.correct?' correct':(myAns&&myAns.answer===opt.text&&!opt.correct?' wrong':''))});
          div.appendChild(document.createTextNode(opt.text));
          if(opt.correct) div.appendChild(document.createTextNode(' ✓'));
          contentWrap.appendChild(div);
        });
      } else {
        contentWrap.appendChild(el('div',{class:'card'},[
          el('div',{style:'font-size:13px;color:var(--muted);margin-bottom:6px;'},'Tu respuesta:'),
          el('div',{style:'font-size:16px;font-weight:700;'},[myAns?myAns.answer:'(sin respuesta)']),
          el('div',{style:'font-size:13px;color:var(--muted);margin-top:10px;margin-bottom:4px;'},'Respuesta correcta:'),
          el('div',{style:'font-size:16px;color:var(--success);font-weight:700;'},[q.correctText||'(abierta)'])
        ]));
      }
      if(myAns){
        contentWrap.appendChild(el('div',{style:'text-align:center;font-size:32px;margin:16px 0;'},[myAns.correct?'✅':'❌']));
      }
      contentWrap.appendChild(el('div',{class:'waiting-screen',style:'padding:16px;'},[
        el('div',{class:'muted'},'Espera a que el maestro pase a la siguiente pregunta...')
      ]));
    } else if(answered){
      contentWrap.appendChild(el('div',{class:'waiting-screen'},[
        el('div',{class:'big-emoji',style:'font-size:48px;margin-bottom:12px;'},'⏳'),
        el('div',{style:'font-size:16px;color:var(--navy);'},'Respuesta enviada, espera...')
      ]));
    } else {
      // Show answer UI
      if(q.type==='multiple'){
        q.options.forEach(opt=>{
          const div=el('div',{class:'qi-option'});
          div.appendChild(document.createTextNode(opt.text));
          div.addEventListener('click',async()=>{
            if(answered) return;
            answered=true;
            const isCorrect=opt.correct;
            const currScore=(d.scores&&d.scores[name])||0;
            const newScore=isCorrect?currScore+(q.points||10):currScore;
            const ansObj={answer:opt.text,correct:isCorrect,ts:Date.now()};
            await db.collection('kuato_juegos').doc(code).update({
              [`answers.${curIdx}.${name}`]:ansObj,
              [`scores.${name}`]:newScore
            });
            contentWrap.innerHTML='';
            contentWrap.appendChild(el('div',{class:'waiting-screen'},[
              el('div',{class:'big-emoji',style:'font-size:48px;margin-bottom:12px;'},'⏳'),
              el('div',{style:'font-size:16px;color:var(--navy);'},'Respuesta enviada, espera...')
            ]));
          });
          contentWrap.appendChild(div);
        });
      } else {
        const tf2=el('div',{class:'field'});
        tf2.appendChild(el('label',{},'Tu respuesta:'));
        const tin=el('input',{type:'text',placeholder:'Escribe tu respuesta...'});
        tf2.appendChild(tin);
        contentWrap.appendChild(tf2);
        const sendBtn=el('button',{class:'btn btn-primary btn-full',style:'font-size:15px;padding:12px;'},'Enviar');
        sendBtn.addEventListener('click',async()=>{
          if(answered) return;
          const ans=tin.value.trim();
          if(!ans) return;
          answered=true;
          const isCorrect=q.correctText?ans.toLowerCase()===q.correctText.toLowerCase():false;
          const currScore=(d.scores&&d.scores[name])||0;
          const newScore=isCorrect?currScore+(q.points||10):currScore;
          const ansObj={answer:ans,correct:isCorrect,ts:Date.now()};
          await db.collection('kuato_juegos').doc(code).update({
            [`answers.${curIdx}.${name}`]:ansObj,
            [`scores.${name}`]:newScore
          });
          contentWrap.innerHTML='';
          contentWrap.appendChild(el('div',{class:'waiting-screen'},[
            el('div',{class:'big-emoji',style:'font-size:48px;margin-bottom:12px;'},'⏳'),
            el('div',{style:'font-size:16px;color:var(--navy);'},'Respuesta enviada, espera...')
          ]));
        });
        tin.addEventListener('keydown',e=>{if(e.key==='Enter')sendBtn.click();});
        contentWrap.appendChild(sendBtn);
      }
    }
  });
}

/* ── Floating Chat Widget ── */
let chatWidgetEl=null;
let chatWidgetListener=null;

function removeChatWidget(){
  if(chatWidgetEl){ chatWidgetEl.remove(); chatWidgetEl=null; }
  if(chatWidgetListener){ chatWidgetListener(); chatWidgetListener=null; }
}

function renderChatWidget(maestro){
  removeChatWidget();
  const widget=el('div',{class:'chat-widget'});
  chatWidgetEl=widget;

  const box=el('div',{class:'chat-box',id:'chatBox'});
  const chatHeader=el('div',{class:'chat-header'});
  chatHeader.appendChild(el('span',{},'💬 Contactar a Shishi'));
  const closeBtn=el('button',{style:'background:none;border:none;color:#fff;font-size:18px;cursor:pointer;'},'×');
  closeBtn.addEventListener('click',()=>{ box.classList.remove('open'); });
  chatHeader.appendChild(closeBtn);
  box.appendChild(chatHeader);

  const msgs=el('div',{class:'chat-messages',id:'chatMessages'});
  box.appendChild(msgs);

  const inputRow=el('div',{class:'chat-input-row'});
  const chatIn=el('input',{type:'text',placeholder:'Escribe un mensaje...'});
  const sendBtn=el('button',{},'Enviar');
  inputRow.appendChild(chatIn);
  inputRow.appendChild(sendBtn);
  box.appendChild(inputRow);

  async function sendMsg(){
    const txt=chatIn.value.trim(); if(!txt) return;
    const snap=await db.collection('kuato_herramientas').doc('admin_data').get();
    const existing=(snap.exists && snap.data().adminChat)||[];
    existing.push({from:'maestro',name:maestro.username,text:txt,ts:Date.now()});
    await db.collection('kuato_herramientas').doc('admin_data').set({adminChat:existing},{merge:true});
    chatIn.value='';
  }
  sendBtn.addEventListener('click',sendMsg);
  chatIn.addEventListener('keydown',e=>{ if(e.key==='Enter') sendMsg(); });

  chatWidgetListener=db.collection('kuato_herramientas').doc('admin_data').onSnapshot(snap=>{
    if(!snap.exists) return;
    const msgList=snap.data().adminChat||[];
    const el2=document.getElementById('chatMessages');
    if(!el2) return;
    el2.innerHTML='';
    msgList.forEach(m=>{
      const isMe=m.from==='maestro' && m.name===maestro.username;
      const msgEl=el('div',{class:'chat-msg '+(isMe?'from-me':'from-other')});
      if(!isMe) msgEl.appendChild(el('div',{class:'msg-name'},[m.name]));
      msgEl.appendChild(document.createTextNode(m.text));
      el2.appendChild(msgEl);
    });
    el2.scrollTop=el2.scrollHeight;
  });

  const toggle=el('button',{class:'chat-toggle'},'💬 Contactar a Shishi');
  toggle.addEventListener('click',()=>{ box.classList.toggle('open'); const el2=document.getElementById('chatMessages'); if(el2) el2.scrollTop=el2.scrollHeight; });

  widget.appendChild(box);
  widget.appendChild(toggle);
  document.body.appendChild(widget);
}

/* ═══════════════════════════════════════════════════════
   PASE DE LISTA (asistencia)
═══════════════════════════════════════════════════════ */
function renderAsistenciaHost(code){
  clearRoot();
  const r=root();

  const hdr=el('div',{class:'act-header'});
  hdr.appendChild(el('span',{class:'act-header-title'},['📋 Pase de lista']));
  hdr.appendChild(el('span',{class:'code-badge'},[code]));
  r.appendChild(hdr);

  // Config: duración
  const configCard=el('div',{class:'card'});
  configCard.appendChild(el('h3',{},'Configuración'));
  configCard.appendChild(el('p',{class:'muted',style:'margin-bottom:12px;font-size:13px;'},'¿Por cuánto tiempo estará abierto el registro?'));

  const durRow=el('div',{style:'display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;'});
  const durInput=el('input',{type:'number',min:'1',max:'120',value:'5',style:'width:80px;padding:8px;border:1px solid var(--border-strong);border-radius:8px;font-size:16px;text-align:center;font-family:monospace;'});
  const durUnit=el('select',{style:'padding:8px;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;font-family:inherit;'});
  durUnit.appendChild(el('option',{value:'60'},'minutos'));
  durUnit.appendChild(el('option',{value:'1'},'segundos'));
  durRow.appendChild(durInput);
  durRow.appendChild(durUnit);
  configCard.appendChild(durRow);

  const startBtn=el('button',{class:'btn btn-primary'},'▶ Iniciar pase de lista');
  configCard.appendChild(startBtn);
  r.appendChild(configCard);

  // Panel de asistencia (oculto al inicio)
  const mainPanel=el('div',{style:'display:none;'});

  // Timer
  const timerWrap=el('div',{class:'timer-ring'});
  const timerNum=el('div',{class:'timer-num'},['—']);
  const timerLbl=el('div',{class:'timer-label'},['segundos restantes']);
  timerWrap.appendChild(timerNum);
  timerWrap.appendChild(timerLbl);
  mainPanel.appendChild(timerWrap);

  // Estado
  const statusBadge=el('div',{style:'text-align:center;margin-bottom:16px;'});
  mainPanel.appendChild(statusBadge);

  // Lista de alumnos
  const listCard=el('div',{class:'card'});
  const listTitle=el('h3',{},'Alumnos presentes (0)');
  listCard.appendChild(listTitle);
  const listEl=el('ul',{class:'asistencia-list'});
  listCard.appendChild(listEl);

  const copyBtn=el('button',{class:'copy-btn',style:'margin-top:14px;width:100%;'},'📋 Copiar lista');
  copyBtn.style.display='none';
  listCard.appendChild(copyBtn);
  mainPanel.appendChild(listCard);
  r.appendChild(mainPanel);

  let timerInterval=null;
  let attendees=[];

  startBtn.addEventListener('click',async()=>{
    const secs=parseInt(durInput.value)*parseInt(durUnit.value);
    if(isNaN(secs)||secs<1){alert('Duración inválida.');return;}
    const expiresAt=Date.now()+secs*1000;
    await sessionDoc.update({status:'active', expiresAt, attendees:[]});
    configCard.style.display='none';
    mainPanel.style.display='';
    statusBadge.innerHTML='<span style="background:#dcfce7;color:#16a34a;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:700;">✅ Abierto</span>';
    copyBtn.style.display='none';

    // Countdown
    function tick(){
      const left=Math.max(0,Math.ceil((expiresAt-Date.now())/1000));
      timerNum.textContent=left>60?Math.ceil(left/60)+(left%60===0?'':''): left;
      timerLbl.textContent=left>60?'minutos restantes':'segundos restantes';
      if(left===0){
        clearInterval(timerInterval);
        sessionDoc.update({status:'closed'});
        statusBadge.innerHTML='<span style="background:#fee2e2;color:#dc2626;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:700;">🔒 Cerrado</span>';
        copyBtn.style.display='';
      }
    }
    tick();
    timerInterval=setInterval(tick,1000);
  });

  // Listener tiempo real
  sessionListener=sessionDoc.onSnapshot(snap=>{
    if(!snap.exists) return;
    const d=snap.data();
    attendees=(d.attendees||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'es'));
    listTitle.textContent=`Alumnos presentes (${attendees.length})`;
    listEl.innerHTML='';
    attendees.forEach((a,i)=>{
      const li=el('li',{class:'asistencia-item'},[
        el('span',{},[`${i+1}. ${a.name}`]),
        el('span',{style:'font-size:11px;color:var(--muted);'},[new Date(a.ts).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})])
      ]);
      listEl.appendChild(li);
    });
    if(d.status==='closed'){
      copyBtn.style.display='';
    }
  });

  copyBtn.addEventListener('click',()=>{
    const txt=attendees.map((a,i)=>`${i+1}. ${a.name}`).join('\n');
    navigator.clipboard.writeText(txt).then(()=>{copyBtn.textContent='✅ Copiado!';setTimeout(()=>copyBtn.textContent='📋 Copiar lista',2000);}).catch(()=>{});
  });
}

    const snap=await sessionDoc.get();
    const d2=snap.data();
    if(d2.status==='closed'||(d2.expiresAt&&Date.now()>d2.expiresAt)){
      err.textContent='Lo sentimos, el registro ya cerró.';err.style.display='';return;
    }
    // Agregar a lista
    const current=d2.attendees||[];
    if(current.find(a=>a.name.toLowerCase()===name.toLowerCase())){
      err.textContent='Tu nombre ya fue registrado.';err.style.display='';return;
    }
    await sessionDoc.update({attendees:[...current,{name,ts:Date.now()}]});
    // Mostrar confirmación
    clearRoot();
    const r2=root();
    r2.appendChild(el('div',{class:'guest-sent'},[
      el('div',{class:'big-emoji'},['🎉']),
      el('h2',{},['¡Listo, '+name+'!']),
      el('p',{},'Tu asistencia fue registrada. ¡Disfruta la clase!')
    ]));
  });
  nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
  card.appendChild(btn);
  r.appendChild(card);

  // Listener por si cierra mientras está en pantalla
  sessionListener=sessionDoc.onSnapshot(snap=>{
    if(!snap.exists) return;
    const d3=snap.data();
    if(d3.status==='closed'||(d3.expiresAt&&Date.now()>d3.expiresAt)){
      if(sessionListener){sessionListener();sessionListener=null;}
      clearRoot();
      const r3=root();
      r3.appendChild(el('div',{class:'guest-sent'},[
        el('div',{class:'big-emoji'},['🔒']),
        el('h2',{},'Registro cerrado'),
        el('p',{},'El maestro cerró el pase de lista.')
      ]));
    }
  });
}

/* ═══════════════════════════════════════════════════════
   PARTICIPACIÓN
═══════════════════════════════════════════════════════ */
const VIBRANT_COLORS=['#7c3aed','#0891b2','#dc2626','#16a34a','#ea580c','#9333ea','#0d9488','#293379'];

function renderParticipacionHost(code){
  clearRoot();
  const r=root();

  const hdr=el('div',{class:'act-header'});
  hdr.appendChild(el('span',{class:'act-header-title'},['✋ Participación']));
  hdr.appendChild(el('span',{class:'code-badge'},[code]));
  r.appendChild(hdr);

  r.appendChild(el('p',{class:'muted',style:'margin-bottom:16px;font-size:13px;'},'Cuando un alumno envíe una pregunta, aparecerá aquí en grande. Toca para descartar.'));

  // Alert overlay (pantalla completa al recibir pregunta)
  const alert=el('div',{class:'part-alert hidden',id:'partAlert'});
  const alertBg=el('div',{class:'part-alert-bg',id:'partAlertBg'});
  const alertQ=el('div',{class:'part-question',id:'partAlertQ'},'');
  const alertS=el('div',{class:'part-student',id:'partAlertS'},'');
  const alertHint=el('div',{class:'part-hint'},['Toca para cerrar']);
  alert.appendChild(alertBg);
  alert.appendChild(alertQ);
  alert.appendChild(alertS);
  alert.appendChild(alertHint);
  document.body.appendChild(alert);

  alert.addEventListener('click',()=>{
    alert.classList.add('hidden');
  });

  // Historial de preguntas
  const histCard=el('div',{class:'card'});
  histCard.appendChild(el('h3',{style:'margin-bottom:12px;'},'Preguntas recibidas'));
  const histList=el('div',{id:'partHistList'});
  histCard.appendChild(histList);

  const copyAllBtn=el('button',{class:'copy-btn',style:'margin-top:14px;width:100%;display:none;'},'📋 Copiar todas las preguntas');
  histCard.appendChild(copyAllBtn);
  r.appendChild(histCard);

  let questions=[];
  let lastCount=0;

  sessionListener=sessionDoc.onSnapshot(snap=>{
    if(!snap.exists) return;
    const d=snap.data();
    questions=(d.questions||[]);

    // Mostrar alerta si llegó nueva
    if(questions.length>lastCount){
      const newest=questions[questions.length-1];
      const bgColor=VIBRANT_COLORS[(questions.length-1)%VIBRANT_COLORS.length];
      alertBg.style.background=bgColor;
      alertQ.textContent=newest.text;
      alertS.textContent='— '+newest.name;
      alert.classList.remove('hidden');
    }
    lastCount=questions.length;

    // Actualizar historial
    histList.innerHTML='';
    if(questions.length===0){
      histList.appendChild(el('p',{class:'muted',style:'text-align:center;padding:20px;'},'Aún no hay preguntas.'));
      copyAllBtn.style.display='none';
    } else {
      questions.slice().reverse().forEach((q,i)=>{
        const row=el('div',{class:'part-q-row'});
        row.appendChild(el('div',{class:'part-q-text'},[q.text]));
        row.appendChild(el('div',{class:'part-q-meta'},[q.name+' · '+new Date(q.ts).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})]));
        histList.appendChild(row);
      });
      copyAllBtn.style.display='';
    }
  });

  copyAllBtn.addEventListener('click',()=>{
    const txt=questions.map((q,i)=>`${i+1}. [${q.name}] ${q.text}`).join('\n');
    navigator.clipboard.writeText(txt).then(()=>{copyAllBtn.textContent='✅ Copiado!';setTimeout(()=>copyAllBtn.textContent='📋 Copiar todas las preguntas',2000);}).catch(()=>{});
  });

  // Iniciar sesión como activa
  sessionDoc.update({status:'active',questions:[]}).catch(()=>{});
}

function renderGuestParticipacion(code, data){
  clearRoot();
  const r=root();

  const hdr=el('div',{class:'act-header'});
  hdr.appendChild(el('span',{class:'act-header-title'},['✋ Participación']));
  hdr.appendChild(el('span',{class:'code-badge'},[code]));
  r.appendChild(hdr);

  const card=el('div',{class:'card',style:'max-width:420px;margin:0 auto;'});
  card.appendChild(el('p',{class:'muted',style:'font-size:13px;margin-bottom:14px;'},'Escribe tu nombre y tu pregunta o duda para el maestro.'));

  const nameInput=el('input',{type:'text',placeholder:'Tu nombre...',style:'width:100%;padding:10px;border:1px solid var(--border-strong);border-radius:8px;font-size:15px;font-family:inherit;margin-bottom:10px;'});
  card.appendChild(nameInput);

  const qInput=el('textarea',{placeholder:'Escribe tu pregunta o duda...',style:'width:100%;padding:10px;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;min-height:100px;margin-bottom:10px;'});
  card.appendChild(qInput);

  const err=el('div',{class:'err',style:'display:none;'});
  card.appendChild(err);

  const btn=el('button',{class:'btn btn-primary btn-full',style:'font-size:15px;padding:13px;'},'✋ Enviar pregunta');
  btn.addEventListener('click',async()=>{
    const name=nameInput.value.trim();
    const text=qInput.value.trim();
    if(!name){err.textContent='Escribe tu nombre.';err.style.display='';return;}
    if(!text){err.textContent='Escribe tu pregunta.';err.style.display='';return;}
    err.style.display='none';
    btn.disabled=true;
    btn.textContent='Enviando...';
    try{
      const snap=await sessionDoc.get();
      const current=(snap.data().questions||[]);
      await sessionDoc.update({questions:[...current,{name,text,ts:Date.now()}]});
      // Mostrar confirmación y opción de enviar otra
      clearRoot();
      const r2=root();
      const done=el('div',{class:'guest-sent'});
      done.appendChild(el('div',{class:'big-emoji'},['✋']));
      done.appendChild(el('h2',{},'¡Pregunta enviada!'));
      done.appendChild(el('p',{style:'color:var(--muted);font-size:14px;margin-bottom:20px;'},'El maestro la verá en pantalla.'));
      const otra=el('button',{class:'btn btn-outline'},'Enviar otra pregunta');
      otra.addEventListener('click',()=>renderGuestParticipacion(code,data));
      done.appendChild(otra);
      r2.appendChild(done);
    }catch(e){
      btn.disabled=false;
      btn.textContent='✋ Enviar pregunta';
      err.textContent='Error al enviar. Intenta de nuevo.';
      err.style.display='';
    }
  });
  card.appendChild(btn);
  r.appendChild(card);
}

/* ─────────────────────────────────────────
   AUTO-CLEANUP: borra sesiones > 24h
───────────────────────────────────────── */
async function cleanupOldSessions(){
  try{
    const cutoff = Date.now() - 24*60*60*1000;
    const snap = await db.collection('kuato_juegos').where('createdAt','<',cutoff).get();
    const batch = db.batch();
    snap.forEach(doc => batch.delete(doc.ref));
    if(!snap.empty) await batch.commit();
  }catch(e){ /* silencioso */ }
}

cleanupOldSessions();
initApp();
</script>
