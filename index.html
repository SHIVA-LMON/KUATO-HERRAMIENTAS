<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KUATO Herramientas</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#293379;--navy-dark:#1a2060;--yellow:#f5c518;--bg:#faf7ee;--card:#ffffff;
  --text:#1a1a2e;--muted:#6b7280;--border:#e5e0d5;--border-strong:#9ca3af;
  --danger:#dc2626;--success:#16a34a;--radius:12px;
  --team1:#293379;--team2:#9333ea;--team3:#0891b2;--team4:#16a34a;
  --team5:#dc2626;--team6:#ea580c;--team7:#0d9488;--team8:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Merriweather',Georgia,serif;background:var(--bg);color:var(--text);min-height:100vh;}
.brand{font-family:'Playfair Display',Georgia,serif;font-weight:700;letter-spacing:.5px;}

/* TOPBAR */
.topbar{background:rgba(41,51,121,0.75);backdrop-filter:blur(16px);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:fixed;top:0;left:0;right:0;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-title{color:#fff;font-size:20px;}
.topbar-title span{color:var(--yellow);}
.topbar-back{color:rgba(255,255,255,.75);font-size:13px;text-decoration:none;display:flex;align-items:center;gap:4px;cursor:pointer;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 10px;font-family:inherit;transition:background .15s;}
.topbar-back:hover{color:#fff;background:rgba(255,255,255,.2);}
.admin-badge{background:var(--yellow);color:var(--navy);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;font-family:'Merriweather',sans-serif;}

.app{padding:72px 16px 40px;max-width:960px;margin:0 auto;}

/* HOME */
.home-title{text-align:center;margin-bottom:8px;}
.home-title h1{font-size:28px;color:var(--navy);}
.home-subtitle{text-align:center;color:var(--muted);font-size:14px;margin-bottom:32px;}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:40px;}
.tool-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:center;}
.tool-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(41,51,121,.12);}
.tool-card:active{transform:scale(.97);}
.tool-icon{font-size:36px;margin-bottom:10px;}
.tool-name{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:4px;}
.tool-desc{font-size:12px;color:var(--muted);line-height:1.5;}

/* JOIN SECTION */
.join-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center;max-width:400px;margin:0 auto;}
.join-box h2{font-size:18px;color:var(--navy);margin-bottom:12px;}
.join-row{display:flex;gap:8px;margin-top:12px;}
.join-row input{flex:1;padding:10px 14px;border:1px solid var(--border-strong);border-radius:8px;font-size:16px;letter-spacing:3px;text-transform:uppercase;font-family:monospace;}
.join-row input:focus{outline:none;border-color:var(--navy);}

/* BUTTONS */
button{cursor:pointer;font-family:'Merriweather',Georgia,serif;}
.btn{padding:10px 20px;border-radius:8px;border:none;font-size:14px;font-weight:700;transition:transform .1s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-dark);}
.btn-yellow{background:var(--yellow);color:var(--navy);}
.btn-yellow:hover{filter:brightness(1.05);}
.btn-outline{background:transparent;border:2px solid var(--navy);color:var(--navy);}
.btn-outline:hover{background:var(--navy);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:6px 14px;font-size:12px;}
.btn-full{width:100%;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

/* TOGGLE PILL BUTTON */
.toggle-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:50px;border:2px solid var(--navy);background:#fff;cursor:pointer;transition:all .2s;font-size:12px;font-weight:700;color:var(--navy);font-family:'Merriweather',Georgia,serif;}
.toggle-pill .pill-icon{width:28px;height:28px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;transition:background .2s;}
.toggle-pill .pill-icon svg{width:14px;height:14px;fill:#fff;}
.toggle-pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.toggle-pill.active .pill-icon{background:var(--yellow);}
.toggle-pill.active .pill-icon svg{fill:var(--navy);}

/* SCREENS */
.screen{display:none;}
.screen.active{display:block;}

/* ACTIVITY HEADER */
.act-header{background:var(--navy);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.act-header-title{color:#fff;font-size:18px;}
.code-badge{background:var(--yellow);color:var(--navy);font-size:18px;font-weight:700;padding:6px 16px;border-radius:8px;letter-spacing:4px;font-family:monospace;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.hidden{display:none;}
.modal-box{background:#fff;border-radius:16px;padding:28px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-box h2{font-size:20px;color:var(--navy);margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}

/* RESULT OVERLAY */
.result-overlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.result-overlay.hidden{display:none;}
.result-backdrop{position:fixed;inset:0;background:rgba(20,20,60,.7);pointer-events:auto;}
.result-name{position:relative;z-index:1;text-align:center;pointer-events:auto;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;}
.result-name .rn-label{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:8px;letter-spacing:1px;}
.result-name .rn-value{font-size:clamp(36px,8vw,80px);font-weight:700;color:var(--yellow);text-shadow:0 4px 24px rgba(0,0,0,.4);font-family:'Playfair Display',serif;line-height:1.1;}
.result-name .rn-hint{color:rgba(255,255,255,.5);font-size:13px;margin-top:16px;}
@keyframes popIn{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}

/* WIN/LOSE OVERLAY */
.endgame-overlay{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;opacity:0;transition:opacity .5s;}
.endgame-overlay.show{opacity:1;pointer-events:auto;}
.endgame-bg{position:fixed;inset:0;z-index:-1;}
.endgame-content{text-align:center;z-index:1;padding:40px;}
.endgame-emoji{font-size:80px;margin-bottom:20px;animation:bounceIn .6s cubic-bezier(.34,1.56,.64,1) both;}
.endgame-title{font-size:clamp(28px,8vw,56px);font-weight:700;font-family:'Playfair Display',serif;line-height:1.1;margin-bottom:12px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4);}
.endgame-sub{font-size:18px;color:rgba(255,255,255,.9);margin-bottom:32px;text-shadow:0 1px 6px rgba(0,0,0,.3);}
@keyframes bounceIn{from{opacity:0;transform:scale(.2) rotate(-10deg);}to{opacity:1;transform:scale(1) rotate(0deg);}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}

/* CANVAS */
canvas{display:block;}

/* INPUTS */
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:5px;}
.field input,.field textarea,.field select{width:100%;padding:9px 12px;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;font-family:inherit;}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--navy);}
.field textarea{resize:vertical;min-height:80px;}

/* CHIP LIST */
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{background:var(--navy);color:#fff;padding:4px 10px;border-radius:20px;font-size:13px;display:flex;align-items:center;gap:6px;}
.chip-x{cursor:pointer;opacity:.7;font-size:16px;line-height:1;}
.chip-x:hover{opacity:1;}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.card h3{font-size:15px;color:var(--navy);margin-bottom:10px;}

/* TEAMS GRID */
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.team-card{background:var(--navy);border-radius:10px;padding:14px;color:#fff;}
.team-card h4{font-size:13px;color:var(--yellow);margin-bottom:8px;}
.team-member{font-size:13px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.1);}
.team-member:last-child{border-bottom:none;}

/* QUIZ */
.quiz-q-card{background:var(--card);border:2px solid var(--navy);border-radius:var(--radius);padding:24px;margin-bottom:16px;}
.quiz-q-text{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:20px;line-height:1.4;}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.quiz-opt{padding:14px;border:2px solid var(--border);border-radius:10px;cursor:pointer;font-size:14px;transition:all .15s;background:#fff;}
.quiz-opt:hover{border-color:var(--navy);background:rgba(41,51,121,.05);}
.quiz-opt.selected{border-color:var(--navy);background:var(--navy);color:#fff;}
.quiz-opt.correct{border-color:var(--success);background:var(--success);color:#fff;}
.quiz-opt.wrong{border-color:var(--danger);background:var(--danger);color:#fff;}
.timer-bar-wrap{background:#e5e0d5;border-radius:4px;height:6px;margin-bottom:16px;overflow:hidden;}
.timer-bar{height:100%;background:var(--navy);border-radius:4px;transition:width .1s linear;}
.timer-bar.urgent{background:var(--danger);}
.quiz-score{font-size:24px;font-weight:700;color:var(--navy);}
.quiz-progress{font-size:13px;color:var(--muted);margin-bottom:16px;}

/* SURVEY */
.survey-opt-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:border-color .15s;}
.survey-opt-row:hover{border-color:var(--navy);}
.survey-opt-row input[type=radio],.survey-opt-row input[type=checkbox]{accent-color:var(--navy);}

/* RESULTS TABLE */
.results-table{width:100%;border-collapse:collapse;font-size:13px;}
.results-table th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;}
.results-table td{padding:8px 12px;border-bottom:1px solid var(--border);}
.results-table tr:nth-child(even) td{background:#f5f0e8;}
.copy-btn{background:var(--yellow);color:var(--navy);border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;}
.copy-btn:hover{filter:brightness(1.05);}

/* NOTES */
.notes-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;white-space:pre-wrap;font-size:13px;color:var(--text);line-height:1.7;min-height:60px;}

/* WAITING */
.waiting-screen{text-align:center;padding:40px 20px;}
.waiting-screen .big-code{font-size:48px;font-weight:700;letter-spacing:8px;color:var(--navy);font-family:monospace;}
.waiting-screen .wt-label{font-size:14px;color:var(--muted);margin-bottom:16px;}
.pulse{animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

/* PARTICIPANT LIST */
.participant-chip{display:inline-block;background:rgba(41,51,121,.1);color:var(--navy);padding:3px 10px;border-radius:20px;font-size:12px;margin:3px;}

/* SCOREBOARD */
.score-grid{display:grid;gap:16px;margin-top:16px;}
.score-tile{border-radius:16px;padding:20px;color:#fff;cursor:pointer;user-select:none;transition:transform .1s,filter .1s;position:relative;overflow:hidden;}
.score-tile:active{transform:scale(.97);}
.score-tile .team-label{font-size:13px;font-weight:700;opacity:.85;margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase;}
.score-tile .score-num{font-size:clamp(48px,12vw,80px);font-weight:700;font-family:'Playfair Display',serif;line-height:1;}
.score-tile .score-hint{font-size:11px;opacity:.6;margin-top:4px;}
.score-tile.big-view{font-size:1.2em;}
.score-tile-mini{border-radius:10px;padding:12px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between;}
.score-tile-mini .mini-label{font-size:12px;font-weight:700;opacity:.85;}
.score-tile-mini .mini-num{font-size:22px;font-weight:700;font-family:'Playfair Display',serif;}

/* RESPONSIVE */
@media(max-width:600px){
  .quiz-options{grid-template-columns:1fr;}
  .tools-grid{grid-template-columns:1fr 1fr;}
  .act-header{flex-direction:column;align-items:flex-start;}
  /* Ruleta móvil: rueda arriba, controles abajo */
  .ruleta-layout{flex-direction:column-reverse!important;}
  .ruleta-canvas-wrap{order:-1;width:100%!important;min-width:unset!important;flex:unset!important;}
  .ruleta-left-panel{order:1;width:100%!important;flex:unset!important;min-width:unset!important;}
  .ruleta-spin-btn-wrap{display:block!important;}
}

/* SECTION TITLE */
.section-title{font-size:18px;color:var(--navy);margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--border);}
.muted{color:var(--muted);font-size:13px;}
.err{color:var(--danger);font-size:13px;margin-top:6px;}
.ok{color:var(--success);font-size:13px;margin-top:6px;}
.sep{height:1px;background:var(--border);margin:20px 0;}
.mt{margin-top:12px;}
.mb{margin-bottom:12px;}

/* MULTI-RULETA */
.ruleta-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.ruleta-tab{padding:6px 14px;border-radius:20px;border:2px solid var(--border);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);transition:all .15s;}
.ruleta-tab.active{border-color:var(--navy);background:var(--navy);color:#fff;}
.ruleta-tab:hover:not(.active){border-color:var(--navy);color:var(--navy);}
.add-ruleta-btn{padding:4px 12px;border-radius:20px;border:2px dashed var(--border-strong);background:transparent;font-size:13px;cursor:pointer;color:var(--muted);font-family:'Merriweather',serif;}
.add-ruleta-btn:hover{border-color:var(--navy);color:var(--navy);}

/* LOGIN */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--card);border-radius:20px;padding:40px 32px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.12);text-align:center;}
.login-card h1{font-size:28px;color:var(--navy);margin-bottom:8px;}
.login-card p{color:var(--muted);font-size:14px;margin-bottom:28px;}
.role-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;border:2px solid var(--border);border-radius:12px;cursor:pointer;background:#fff;transition:all .15s;flex:1;}
.role-btn:hover{border-color:var(--navy);background:rgba(41,51,121,.04);}
.role-btn.selected{border-color:var(--navy);background:var(--navy);color:#fff;}
.role-btn span{font-size:32px;}
.role-btn strong{font-size:14px;}
.role-row{display:flex;gap:12px;margin-bottom:24px;}

/* PLANO */
.plano-svg{border:2px solid var(--border);border-radius:8px;background:#fff;cursor:crosshair;}
.plano-pair-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;}
.plano-color-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
.plano-coord-input{width:100px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:13px;font-family:monospace;}

/* ASISTENCIA */
.asistencia-list{list-style:none;padding:0;margin:0;}
.asistencia-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);font-size:14px;}
.asistencia-item:nth-child(odd){background:#fafafa;}
.timer-ring{display:flex;align-items:center;justify-content:center;flex-direction:column;margin:16px auto;}
.timer-num{font-size:48px;font-weight:700;font-family:'Playfair Display',serif;color:var(--navy);line-height:1;}
.timer-label{font-size:12px;color:var(--muted);margin-top:4px;}

/* PARTICIPACION */
.part-alert{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:40px;cursor:pointer;}
.part-alert.hidden{display:none;}
.part-alert-bg{position:fixed;inset:0;z-index:-1;}
.part-question{font-size:clamp(24px,5vw,48px);font-weight:700;font-family:'Playfair Display',serif;color:#fff;text-align:center;text-shadow:0 2px 16px rgba(0,0,0,.3);line-height:1.3;margin-bottom:20px;}
.part-student{font-size:18px;color:rgba(255,255,255,.8);text-align:center;}
.part-hint{font-size:13px;color:rgba(255,255,255,.5);margin-top:24px;}
.part-q-row{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:8px;}
.part-q-text{font-size:14px;color:var(--text);margin-bottom:4px;}
.part-q-meta{font-size:12px;color:var(--muted);}
.guest-sent{text-align:center;padding:40px 20px;}
.guest-sent .big-emoji{font-size:64px;margin-bottom:16px;}
.guest-sent h2{font-size:22px;color:var(--navy);margin-bottom:8px;}
.guest-sent p{color:var(--muted);font-size:14px;}

/* ORDEN */
.orden-question-card{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;}
.orden-q-prompt{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:14px;}
.orden-cards-row{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:1px dashed var(--border-strong);border-radius:8px;}
.orden-card-item{background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;cursor:grab;user-select:none;font-size:14px;border:2px solid transparent;}
.orden-card-item:active{cursor:grabbing;}
.orden-card-item.dragging{opacity:0.5;border-color:var(--yellow);}
.orden-card-item.drag-over{border-color:var(--yellow);}

/* ADMIN PANEL */
.admin-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
.admin-section h2{font-size:17px;color:var(--navy);margin-bottom:16px;}
.maestro-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.maestro-row:last-child{border-bottom:none;}
.exp-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;}
.exp-badge.active{background:#dcfce7;color:#16a34a;}
.exp-badge.expired{background:#fee2e2;color:#dc2626;}

/* CLASE */
.clase-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s;display:flex;align-items:center;justify-content:space-between;}
.clase-card:hover{box-shadow:0 4px 16px rgba(41,51,121,.12);}
.clase-code{font-family:monospace;font-size:22px;font-weight:700;color:var(--navy);letter-spacing:4px;}
.clase-student-activity{background:#fff;border:2px solid var(--navy);border-radius:14px;padding:20px;margin-bottom:12px;cursor:pointer;transition:all .15s;text-align:center;}
.clase-student-activity:hover{background:var(--navy);color:#fff;}
.clase-student-activity .act-icon{font-size:32px;margin-bottom:8px;}
.clase-student-activity .act-name{font-size:16px;font-weight:700;}
/* QUIZ INTERACTIVO */
.qi-question{font-size:clamp(18px,4vw,28px);font-weight:700;color:var(--navy);line-height:1.4;margin-bottom:24px;text-align:center;}
.qi-option{padding:16px 20px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer;font-size:15px;transition:all .15s;background:#fff;text-align:center;}
.qi-option:hover{border-color:var(--navy);background:rgba(41,51,121,.05);}
.qi-option.selected{border-color:var(--navy);background:var(--navy);color:#fff;}
.qi-option.correct{border-color:var(--success);background:var(--success);color:#fff;}
.qi-option.wrong{border-color:var(--danger);background:var(--danger);color:#fff;}
.qi-answer-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:14px;}
.qi-answer-row.correct{background:#dcfce7;}
.qi-answer-row.wrong{background:#fee2e2;}
.qi-answer-row.waiting{background:#f3f4f6;}
.qi-score-card{background:var(--navy);border-radius:16px;padding:24px;color:#fff;text-align:center;margin-bottom:12px;}
.qi-score-big{font-size:56px;font-weight:700;font-family:'Playfair Display',serif;color:var(--yellow);}

<script>

/* ─────────────────────────────────────────
   STATE GLOBAL
───────────────────────────────────────── */
let isAdmin = false;
let currentTool = null;
let currentCode = null;
let currentRole = null;
let sessionDoc = null;
let sessionListener = null;
let currentMaestro = null;
let adminChatListener = null;

const urlParams = new URLSearchParams(location.search);
if(urlParams.get('admin') === '1'){
  isAdmin = true;
  document.getElementById('adminBadge').style.display = '';
}

/* ─────────────────────────────────────────
   UTILIDADES
───────────────────────────────────────── */
function uid5(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function el(tag,attrs={},children=[]){
  const e=document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}
function root(){ return document.getElementById('appRoot'); }
function clearRoot(){ root().innerHTML=''; }

function showModal(buildFn){
  const ov=document.getElementById('modalOverlay');
  const box=document.getElementById('modalBox');
  box.innerHTML='';
  buildFn(box);
  ov.classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.add('hidden');
}
document.getElementById('modalOverlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('modalOverlay')) closeModal();
});

function copyText(txt){
  navigator.clipboard.writeText(txt).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  });
}

function stopSession(){
  if(sessionListener){ sessionListener(); sessionListener=null; }
  currentCode=null; currentTool=null; currentRole=null; sessionDoc=null;
}

/* ─── NAVEGACIÓN CON HISTORIAL DEL NAVEGADOR ─── */
// Cada pantalla empuja un estado; el botón atrás del browser lo restaura.
function pushNav(state){
  // state: { screen: 'home'|'activity'|'clase'|'login', ... }
  history.pushState(state, '');
}

window.addEventListener('popstate', e=>{
  const s = e.state;
  if(!s){ goHome(); return; }
  if(s.screen==='home'){
    stopSession();
    goHome();
  } else if(s.screen==='login'){
    stopSession();
    renderLoginScreen();
  } else if(s.screen==='home_maestro' && currentMaestro){
    stopSession();
    renderMaestroHome(currentMaestro);
  } else {
    // cualquier pantalla de actividad → volver a inicio
    stopSession();
    goHome();
  }
});

function goHome(){
  if(isAdmin || currentMaestro){
    renderHome();
  } else if(currentMaestro){
    renderMaestroHome(currentMaestro);
  } else {
    renderLoginScreen();
  }
}

// Logo KUATO → inicio
document.addEventListener('DOMContentLoaded', ()=>{
  const logo = document.getElementById('topbarLogo');
  if(logo) logo.addEventListener('click', ()=>{
    stopSession();
    goHome();
    history.pushState({screen:'home'}, '');
  });
});

const TEAM_COLORS=['#293379','#9333ea','#0891b2','#16a34a','#dc2626','#ea580c','#0d9488','#7c3aed'];

/* ─────────────────────────────────────────
   HOME
───────────────────────────────────────── */
const ALL_CATEGORIES=[
  {
    label:'General',
    tools:[
      {id:'ruleta',icon:'🎡',name:'Ruleta',desc:'Elige al azar nombres o números'},
      {id:'equipos',icon:'👥',name:'Equipos',desc:'Forma grupos aleatorios equitativos'},
      {id:'quiz',icon:'⏱️',name:'Quiz rápido',desc:'Preguntas con tiempo y puntos'},
      {id:'quiz_interactivo',icon:'❓',name:'Quiz Interactivo',desc:'Preguntas con calificación automática'},
      {id:'encuesta',icon:'📊',name:'Encuesta',desc:'Recolecta respuestas del grupo'},
      {id:'marcador',icon:'🏆',name:'Marcador',desc:'Contador de puntos por equipo'},
      {id:'orden',icon:'🔢',name:'Orden',desc:'Secuencias para ordenar'},
      {id:'asistencia',icon:'📋',name:'Pase de lista',desc:'Registro de asistencia con tiempo'},
      {id:'participacion',icon:'✋',name:'Participación',desc:'Panel de preguntas en tiempo real'},
    ]
  },
  {
    label:'Matemáticas',
    tools:[
      {id:'plano',icon:'📐',name:'Plano Cartesiano',desc:'Coordenadas en el plano'},
    ]
  }
];

function renderHome(){
  stopSession();
  pushNav({screen:'home'});
  clearRoot();
  const r=root();

  r.appendChild(el('div',{class:'home-title'},[el('h1',{class:'brand'},['KUATO Herramientas'])]));
  r.appendChild(el('div',{class:'home-subtitle'},['Herramientas didácticas interactivas']));

  if(isAdmin){
    ALL_CATEGORIES.forEach(cat=>{
      r.appendChild(el('div',{class:'section-title',style:'margin-top:20px;'},[cat.label]));
      const grid=el('div',{class:'tools-grid'});
      cat.tools.forEach(t=>{
        const card=el('div',{class:'tool-card'});
        card.appendChild(el('div',{class:'tool-icon'},[t.icon]));
        card.appendChild(el('div',{class:'tool-name'},[t.name]));
        card.appendChild(el('div',{class:'tool-desc'},[t.desc]));
        card.addEventListener('click',()=>createActivity(t.id));
        grid.appendChild(card);
      });
      r.appendChild(grid);
    });
  }

  const joinBox=el('div',{class:'join-box'});
  if(!isAdmin){
    joinBox.appendChild(el('p',{class:'muted',style:'margin-bottom:12px;text-align:center;font-size:12px;'},'Ingresa el código que te compartió tu maestro.'));
  }
  joinBox.appendChild(el('h2',{},'Unirse a una actividad'));
  joinBox.appendChild(el('p',{class:'muted',style:'margin-bottom:4px;'},'Ingresa el código que te compartieron'));
  const joinRow=el('div',{class:'join-row'});
  const codeInput=el('input',{type:'text',maxlength:'5',placeholder:'XXXXX'});
  const joinBtn=el('button',{class:'btn btn-primary'},'Entrar');
  joinRow.appendChild(codeInput);
  joinRow.appendChild(joinBtn);
  joinBox.appendChild(joinRow);
  const joinErr=el('div',{class:'err',style:'display:none;'});
  joinBox.appendChild(joinErr);
  joinBtn.addEventListener('click',()=>{
    const code=codeInput.value.trim().toUpperCase();
    if(code.length!==5){joinErr.textContent='Escribe un código de 5 caracteres.';joinErr.style.display='';return;}
    joinErr.style.display='none';
    joinWithCode(code);
  });
  codeInput.addEventListener('keydown',e=>{ if(e.key==='Enter') joinBtn.click(); });
  r.appendChild(joinBox);
}

const toolNames={ruleta:'Ruleta',equipos:'Equipos',quiz:'Quiz rápido',quiz_interactivo:'Quiz Interactivo',encuesta:'Encuesta',marcador:'Marcador',plano:'Plano Cartesiano',orden:'Orden',asistencia:'Pase de lista',participacion:'Participación'};

async function createActivity(toolId){
  const code=uid5();
  currentCode=code; currentTool=toolId; currentRole='host';
  const data={tool:toolId, code, status:'waiting', createdAt:Date.now(), items:[], history:[], participants:{}};
  sessionDoc=db.collection('kuato_juegos').doc(code);
  await sessionDoc.set(data);
  renderHostSetup(toolId, code);
}

async function joinWithCode(code){
  try{
    const snap=await db.collection('kuato_juegos').doc(code).get();
    if(snap.exists){
      const data=snap.data();
      if(data.status==='finished'){ alert('Esta actividad ya finalizó.'); return; }
      currentCode=code; currentTool=data.tool; currentRole='guest';
      sessionDoc=db.collection('kuato_juegos').doc(code);
      renderGuestEntry(data.tool, code, data);
      return;
    }
    // Check kuato_clases
    const claseSnap=await db.collection('kuato_clases').doc(code).get();
    if(claseSnap.exists){
      renderClaseStudentEntry(code, claseSnap.data());
      return;
    }
    alert('Código no encontrado o sesión finalizada.');
  }catch(e){ alert('Error al buscar el código.'); console.error(e); }
}

function renderGuestEntry(toolId, code, data){
  pushNav({screen:'activity', toolId, code, role:'guest'});
  if(toolId==='ruleta'||toolId==='equipos'){
    renderGuestViewer(toolId, code, data); return;
  }
  if(toolId==='asistencia'){
    renderGuestAsistencia(code, data); return;
  }
  if(toolId==='participacion'){
    renderGuestParticipacion(code, data); return;
  }
  if(toolId==='marcador'){
    renderGuestMarcadorEntry(code, data); return;
  }
  if(toolId==='encuesta' && data.anonymous){
    renderGuestSurvey(code, data, null); return;
  }
  // plano and orden fall through to name entry below
  clearRoot();
  const r=root();
  r.appendChild(el('div',{class:'waiting-screen'},[
    el('div',{class:'wt-label'},['Actividad encontrada']),
    el('div',{class:'big-code'},[code]),
    el('div',{style:'margin-top:24px;'},[el('div',{class:'section-title'},[toolNames[toolId]])]),
  ]));
  const card=el('div',{class:'card',style:'max-width:360px;margin:0 auto;'});
  card.appendChild(el('h3',{},'¿Cómo te llamas?'));
  const nameInput=el('input',{type:'text',placeholder:'Tu nombre...',style:'width:100%;padding:10px;border:1px solid var(--border-strong);border-radius:8px;font-size:15px;font-family:inherit;margin-top:8px;'});
  card.appendChild(nameInput);
  const err=el('div',{class:'err',style:'display:none;'});
  card.appendChild(err);
  const btn=el('button',{class:'btn btn-primary btn-full',style:'margin-top:12px;'},'Participar');
  btn.addEventListener('click',async()=>{
    const name=nameInput.value.trim();
    if(!name){err.textContent='Escribe tu nombre.';err.style.display='';return;}
    await sessionDoc.update({[`participants.${name}`]:{joinedAt:Date.now()}});
    if(toolId==='quiz') renderGuestQuiz(code, data, name);
    else if(toolId==='quiz_interactivo') renderGuestQuizInteractivo(code, data, name);
    else if(toolId==='plano') renderGuestPlano(code, data, name);
    else if(toolId==='orden') renderGuestOrden(code, data, name);
    else renderGuestSurvey(code, data, name);
  });
  nameInput.addEventListener('keydown',e=>{ if(e.key==='Enter') btn.click(); });
  card.appendChild(btn);
  r.appendChild(card);
}

function renderHostSetup(toolId, code){
  pushNav({screen:'activity', toolId, code, role:'host'});
  if(toolId==='ruleta') renderRuletaHost(code);
  else if(toolId==='equipos') renderEquiposHost(code);
  else if(toolId==='quiz') renderQuizEditor(code);
  else if(toolId==='quiz_interactivo') renderQuizInteractivoEditor(code);
  else if(toolId==='encuesta') renderEncuestaEditor(code);
  else if(toolId==='marcador') renderMarcadorSetup(code);
  else if(toolId==='plano') renderPlanoHost(code);
  else if(toolId==='orden') renderOrdenHost(code);
  else if(toolId==='asistencia') renderAsistenciaHost(code);
  else if(toolId==='participacion') renderParticipacionHost(code);
}

/* ═══════════════════════════════════════════════════════
   RULETA — multi-ruleta
═══════════════════════════════════════════════════════ */
// Cada ruleta: { id, name, items:[], history:[], keep:true, angle:0, spinning:false }
let ruletas = [];
let activeRuletaIdx = 0;
let wheelAnimFrames = {}; // id -> animFrameId

function renderRuletaHost(code){
  clearRoot();
  const r=root();

  const hdr=el('div',{class:'act-header'});
  hdr.appendChild(el('span',{class:'act-header-title'},['🎡 Ruleta']));
  hdr.appendChild(el('span',{class:'code-badge'},[code]));
  r.appendChild(hdr);

  // Participantes viendo
  const pWrap=el('div',{style:'font-size:13px;color:var(--muted);margin-bottom:12px;'});
  pWrap.appendChild(el('span',{},'Viendo en vivo: '));
  const pCount=el('span',{style:'font-weight:700;color:var(--navy);'},['—']);
  pWrap.appendChild(pCount);
  r.appendChild(pWrap);

  // Inicializar con una ruleta si vacío
  if(ruletas.length===0){
    ruletas=[{id:'r1',name:'Ruleta 1',items:[],history:[],keep:true,angle:0,spinning:false}];
    activeRuletaIdx=0;
  }

  const container=el('div',{id:'ruletaContainer'});
  r.appendChild(container);

  function rebuildUI(){
    container.innerHTML='';

    // Tabs de ruletas
    const tabsRow=el('div',{class:'ruleta-tabs'});
    ruletas.forEach((rul,idx)=>{
      const tab=el('div',{class:'ruleta-tab'+(idx===activeRuletaIdx?' active':'')});
      tab.textContent=rul.name;
      tab.addEventListener('click',()=>{ activeRuletaIdx=idx; rebuildUI(); });
      tabsRow.appendChild(tab);
    });
    const addTab=el('button',{class:'add-ruleta-btn'},'+ Ruleta');
    addTab.addEventListener('click',()=>{
      const n=ruletas.length+1;
      ruletas.push({id:'r'+n+'_'+Date.now(),name:'Ruleta '+n,items:[],history:[],keep:true,angle:0,spinning:false});
      activeRuletaIdx=ruletas.length-1;
      rebuildUI();
    });
    tabsRow.appendChild(addTab);
    container.appendChild(tabsRow);

    const rul=ruletas[activeRuletaIdx];

    const layout=el('div',{class:'ruleta-layout',style:'display:flex;gap:20px;flex-wrap:wrap;'});

    // Panel izquierdo
    const leftPanel=el('div',{class:'ruleta-left-panel',style:'flex:0 0 280px;min-width:220px;'});

    // Nombre de ruleta
    const nameCard=el('div',{class:'card'});
    nameCard.appendChild(el('h3',{},'Nombre de esta ruleta'));
    const nameInput=el('input',{type:'text',value:rul.name,style:'width:100%;padding:8px;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;font-family:inherit;'});
    nameInput.addEventListener('input',()=>{ rul.name=nameInput.value; tabsRow.querySelectorAll('.ruleta-tab')[activeRuletaIdx].textContent=rul.name; });
    nameCard.appendChild(nameInput);
    leftPanel.appendChild(nameCard);

    // Agregar ítem
    const addCard=el('div',{class:'card'});
    addCard.appendChild(el('h3',{},'Agregar elemento'));
    const addInput=el('input',{type:'text',placeholder:'Ej: Dalia',style:'width:100%;padding:9px;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;font-family:inherit;'});
    addCard.appendChild(addInput);
    const addBtn=el('button',{class:'btn btn-primary btn-full',style:'margin-top:8px;'},'Agregar');
    const itemList=el('div',{class:'chip-list',style:'margin-top:10px;'});
    const canvasWrap=el('div',{class:'ruleta-canvas-wrap',style:'flex:1;min-width:260px;'});

    function refreshWheel(){
      drawWheel(canvasWrap.querySelector('canvas'), rul);
      syncRuletasToFirebase();
    }

    function addItem(val){
      val=val.trim(); if(!val) return;
      rul.items.push(val);
      refreshWheel(); renderItemList(); addInput.value='';
    }

    function renderItemList(){
      itemList.innerHTML='';
      rul.items.forEach((it,i)=>{
        const chip=el('div',{class:'chip'},[it]);
        const x=el('span',{class:'chip-x'},['×']);
        x.addEventListener('click',()=>{ rul.items.splice(i,1); refreshWheel(); renderItemList(); });
        chip.appendChild(x);
        itemList.appendChild(chip);
      });
    }
    renderItemList();

    addBtn.addEventListener('click',()=>addItem(addInput.value));
    addInput.addEventListener('keydown',e=>{ if(e.key==='Enter') addItem(addInput.value); });
    addCard.appendChild(addBtn);
    addCard.appendChild(itemList);
    leftPanel.appendChild(addCard);

    // Carga masiva
    const bulkCard=el('div',{class:'card'});
    bulkCard.appendChild(el('h3',{},'Carga masiva'));
    const bulkTA=el('textarea',{placeholder:'Un nombre por línea',style:'width:100%;padding:9px;border:1px solid var(--border-strong);border-radius:8px;font-size:13px;font-family:inherit;min-height:70px;'});
    bulkCard.appendChild(bulkTA);
    const bulkBtn=el('button',{class:'btn btn-yellow btn-full',style:'margin-top:6px;'},'Agregar todos');
    bulkBtn.addEventListener('click',()=>{
      bulkTA.value.split('\n').map(l=>l.trim()).filter(l=>l).forEach(l=>rul.items.push(l));
      refreshWheel(); renderItemList(); bulkTA.value='';
    });
    bulkCard.appendChild(bulkBtn);
    leftPanel.appendChild(bulkCard);

    // Controles + toggles
    const actCard=el('div',{class:'card'});
    actCard.appendChild(el('h3',{},'Controles'));

    // Toggle mantener/no mantener
    const keepToggle=buildTogglePill(
      rul.keep,
      rul.keep ? 'Mantener elementos' : 'Quitar al girar',
      rul.keep,
      (val)=>{
        rul.keep=val;
        keepToggle.querySelector('.pill-label').textContent=val?'Mantener elementos':'Quitar al girar';
      }
    );
    keepToggle.style.marginBottom='10px';
    actCard.appendChild(keepToggle);

    const spinBtn=el('button',{class:'btn btn-primary btn-full'},'▶ Girar ruleta');
    spinBtn.addEventListener('click',()=>spinWheel(canvasWrap.querySelector('canvas'), spinBtn, rul));
    actCard.appendChild(spinBtn);

    actCard.appendChild(el('div',{class:'sep'}));

    const resetBtn=el('button',{class:'btn btn-danger btn-full btn-sm'},'Reiniciar esta ruleta');
    resetBtn.addEventListener('click',()=>{
      if(!confirm('¿Eliminar todos los datos de esta ruleta?')) return;
      rul.items=[]; rul.history=[]; rul.angle=0;
      refreshWheel(); renderItemList(); renderHistory();
      syncRuletasToFirebase();
    });

function buildTogglePill(initialState, label, active, onChange){
  const pill=el('button',{class:'toggle-pill'+(initialState?' active':'')});
  const icon=el('div',{class:'pill-icon'});
  // Ícono: check cuando activo, X cuando no
  icon.innerHTML=initialState
    ? `<svg viewBox="0 0 16 16"><path d="M3 8l4 4 6-6" stroke="#293379" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`
    : `<svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>`;
  const labelEl=el('span',{class:'pill-label'},[label]);
  pill.appendChild(icon);
  pill.appendChild(labelEl);
  let state=initialState;
  pill.addEventListener('click',()=>{
    state=!state;
    pill.classList.toggle('active',state);
    icon.innerHTML=state
      ? `<svg viewBox="0 0 16 16"><path d="M3 8l4 4 6-6" stroke="#293379" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`
      : `<svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>`;
    labelEl.textContent=state?'Mantener elementos':'Quitar al girar';
    onChange(state);

const WHEEL_COLORS=['#293379','#f5c518','#1a2060','#e8a000','#3a45a0','#ffd44f','#4f5eb5','#c8920f'];

function drawWheel(canvas, rul){
  if(!canvas) return;
  const items=rul?rul.items:wheelItems;
  const angle=rul?rul.angle:wheelAngle;
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  const cx=W/2, cy=H/2, r=Math.min(W,H)*0.42;
  ctx.clearRect(0,0,W,H);

  if(items.length===0){
    ctx.fillStyle='#e5e0d5';
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#9ca3af';
    ctx.font='14px Merriweather,serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('Agrega elementos',cx,cy);
    drawPointer(ctx,cx,cy,r);
    return;
  }

  const n=items.length;
  const sliceAngle=(2*Math.PI)/n;

  for(let i=0;i<n;i++){
    const start=angle+i*sliceAngle;
    const end=start+sliceAngle;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end);
    ctx.closePath();
    ctx.fillStyle=WHEEL_COLORS[i%WHEEL_COLORS.length];
    ctx.fill();
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1.5;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(start+sliceAngle/2);
    ctx.textAlign='right';
    ctx.textBaseline='middle';
    ctx.fillStyle='#fff';
    const fontSize=Math.max(9,Math.min(14,r*0.18));
    ctx.font=`bold ${fontSize}px Merriweather,serif`;
    const label=items[i].length>12?items[i].slice(0,11)+'…':items[i];
    ctx.fillText(label,r*0.88,0);
    ctx.restore();
  }

  ctx.beginPath(); ctx.arc(cx,cy,r*0.1,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();

  drawPointer(ctx,cx,cy,r);
}

function drawPointer(ctx,cx,cy,r){
  // Triángulo arriba de la rueda: base arriba, vértice apuntando hacia la rueda
  ctx.save();
  ctx.translate(cx, cy-r-2); // pegado al borde superior
  ctx.beginPath();
  ctx.moveTo(0, 20);     // vértice (punta hacia la rueda = hacia abajo)
  ctx.lineTo(-12, 0);    // esquina izquierda de la base (arriba)
  ctx.lineTo(12, 0);     // esquina derecha de la base (arriba)
  ctx.closePath();
  ctx.fillStyle='#dc2626';
  ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();
}

function spinWheel(canvas, btn, rul){
  if(rul.spinning || rul.items.length<2) return;
  rul.spinning=true;
  btn.disabled=true;

  const n=rul.items.length;
  const sliceAngle=(2*Math.PI)/n;
  const extraSpins=Math.floor(Math.random()*5)+8;
  const targetSlice=Math.floor(Math.random()*n);
  const targetAngle=rul.angle+(extraSpins*2*Math.PI)+(targetSlice*sliceAngle);

  const duration=3000; // más rápido que antes (era 4000)
  const start=performance.now();
  const startAngle=rul.angle;

  function easeOut(t){ return 1-Math.pow(1-t,3); } // cúbico, más ágil

  function step(now){
    const t=Math.min((now-start)/duration,1);
    rul.angle=startAngle+(targetAngle-startAngle)*easeOut(t);
    drawWheel(canvas, rul);

    if(Math.floor(t*100)%3===0){
      sessionDoc.update({
        spinning:true,
        activeRuletaId:rul.id,
        spinAngle:rul.angle,
        ruletaItems:rul.items
      }).catch(()=>{});
    }

    if(t<1){ wheelAnimFrames[rul.id]=requestAnimationFrame(step); return; }

    // Finalizado
    rul.angle=targetAngle%(2*Math.PI);
    drawWheel(canvas, rul);
    rul.spinning=false;
    btn.disabled=false;

    // El puntero está ARRIBA (ángulo π*1.5 en coordenadas canvas = parte superior)
    const norm=((rul.angle%(2*Math.PI))+(2*Math.PI))%(2*Math.PI);
    const pointerAngle=(Math.PI*1.5-norm+(2*Math.PI))%(2*Math.PI); // π*1.5 = arriba
    const winner=rul.items[Math.floor(pointerAngle/sliceAngle)%n];

    syncRuletasToFirebase();
    sessionDoc.update({spinning:false,lastWinner:winner,lastRuletaName:rul.name}).catch(()=>{});

    // Historial y eliminación ocurren cuando el maestro toca para cerrar el overlay
    showResultOverlay(winner, ()=>{
      rul.history.push(winner);
      if(!rul.keep){
        rul.items=rul.items.filter(it=>it!==winner);
      }
      // Refrescar UI
      const itemListEl=document.querySelector('.chip-list');
      if(itemListEl){
        itemListEl.innerHTML='';
        rul.items.forEach((it,i)=>{
          const chip=document.createElement('div'); chip.className='chip'; chip.textContent=it;
          const x=document.createElement('span'); x.className='chip-x'; x.textContent='×';
          x.addEventListener('click',()=>{ rul.items.splice(i,1); refreshWheel&&refreshWheel(); });
          chip.appendChild(x); itemListEl.appendChild(chip);
        });
      }
      const histBoxEl=document.querySelector('.notes-box');
      if(histBoxEl) histBoxEl.textContent=rul.history.map((h,i)=>`${i+1}. ${h}`).join('\n')||'— vacío —';
      drawWheel(canvas, rul);
      syncRuletasToFirebase();
    });
  }
  wheelAnimFrames[rul.id]=requestAnimationFrame(step);
}

function assignTeams(items,n){
  const shuffled=[...items].sort(()=>Math.random()-.5);
  const teams=Array.from({length:n},(_,i)=>({name:'Equipo '+(i+1),members:[]}));
  shuffled.forEach((it,i)=> teams[i%n].members.push(it));
  return teams;
}

function renderTeamsView(wrap, teams){
  wrap.innerHTML='';
  if(!teams||teams.length===0){ wrap.appendChild(el('p',{class:'muted'},['Genera los equipos para verlos aquí.'])); return; }
  const grid=el('div',{class:'teams-grid'});
  teams.forEach(t=>{
    const card=el('div',{class:'team-card'});
    card.appendChild(el('h4',{},[t.name]));
    t.members.forEach(m=> card.appendChild(el('div',{class:'team-member'},[m])));
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  const copyBtn=el('button',{class:'copy-btn',style:'margin-top:12px;'},['Copiar equipos']);
  copyBtn.addEventListener('click',()=>{
    const txt=teams.map(t=>t.name+':\n'+t.members.map(m=>'  • '+m).join('\n')).join('\n\n');
    copyText(txt);
  });
  wrap.appendChild(copyBtn);
}

      tr.appendChild(el('td',{},[name]));
      tr.appendChild(el('td',{},[String(res.score||0)]));

    const copyBtn=el('button',{class:'copy-btn',style:'margin-bottom:16px;'},'Copiar resultados');

function renderGuestQuiz(code, data, name){
  const questions=data.questions||[];
  let qi=0, score=0, correctCount=0;
  let timerInterval=null;

  function showQuestion(){
    if(qi>=questions.length){ finishQuiz(); return; }
    clearRoot();
    const r=root();
    const q=questions[qi];

    r.appendChild(el('div',{class:'quiz-progress'},['Pregunta '+(qi+1)+' de '+questions.length+'  •  Puntos: '+score]));

    const timerWrap=el('div',{class:'timer-bar-wrap'});
    const timerBar=el('div',{class:'timer-bar',style:'width:100%;'});
    timerWrap.appendChild(timerBar);
    r.appendChild(timerWrap);

    const qCard=el('div',{class:'quiz-q-card'});
    qCard.appendChild(el('div',{class:'quiz-q-text'},[q.text]));

    const optsGrid=el('div',{class:'quiz-options'});
    let answered=false;
    const optEls=[];

    q.options.forEach((opt,oi)=>{
      const btn=el('div',{class:'quiz-opt'},[opt]);
      btn.addEventListener('click',()=>{
        if(answered) return;
        answered=true;
        clearInterval(timerInterval);
        const isCorrect=oi===q.correct;
        if(isCorrect){ score+=Math.max(10,Math.round((timeLeft/q.time)*100)); correctCount++; }
        optEls[q.correct].classList.add('correct');
        if(!isCorrect) btn.classList.add('wrong');
        setTimeout(()=>{ qi++; showQuestion(); },1200);
      });
      optEls.push(btn);
      optsGrid.appendChild(btn);
    });

    qCard.appendChild(optsGrid);
    r.appendChild(qCard);

    let timeLeft=q.time;
    timerInterval=setInterval(()=>{
      timeLeft--;
      const pct=(timeLeft/q.time)*100;
      timerBar.style.width=pct+'%';
      if(pct<30) timerBar.classList.add('urgent');
      if(timeLeft<=0){
        clearInterval(timerInterval);
        if(!answered){
          answered=true;
          optEls[q.correct].classList.add('correct');
          setTimeout(()=>{ qi++; showQuestion(); },1200);
        }
      }
    },1000);
  }

  function finishQuiz(){
    sessionDoc.update({[`results.${name}`]:{score,correct:correctCount,answers:[]}}).catch(()=>{});
    clearRoot();
    const r=root();
    r.appendChild(el('div',{style:'text-align:center;padding:40px 20px;'},[
      el('div',{style:'font-size:48px;margin-bottom:16px;'},['🎉']),
      el('div',{class:'quiz-score',style:'font-size:36px;'},[score+' pts']),
      el('div',{class:'muted',style:'margin-top:8px;'},[correctCount+'/'+questions.length+' respuestas correctas']),
      el('p',{style:'margin-top:24px;color:var(--muted);font-size:14px;'},['Espera a que el maestro finalice la sesión.']),
    ]));
  }

  showQuestion();
}

    typeSel.appendChild(el('option',{value:t.v},[t.l]));

  const addSQBtn=el('button',{class:'btn btn-yellow btn-full'},'+ Agregar pregunta');

function renderEncuestaResults(code){
  clearRoot();
  const r=root();
  r.appendChild(el('h2',{class:'section-title'},['Resultados de la encuesta']));

  sessionDoc.get().then(snap=>{
    if(!snap.exists) return;
    const d=snap.data();
    const questions=d.questions||[];
    const responses=d.responses||{};
    const respList=Object.entries(responses);

    let copyLines=['Encuesta: '+d.title,'Total respuestas: '+respList.length,''];

    questions.forEach((q,qi)=>{
      const qCard=el('div',{class:'card'});
      qCard.appendChild(el('h3',{},['P'+(qi+1)+': '+q.text]));

      if(q.type==='open'){
        const answers=respList.map(([,res])=>(res.answers||[])[qi]).filter(a=>a);
        answers.forEach(a=> qCard.appendChild(el('div',{style:'padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;'},['"'+a+'"'])));
        copyLines.push('P'+(qi+1)+': '+q.text);
        answers.forEach(a=> copyLines.push('  - '+a));
        copyLines.push('');
      } else {
        const counts={};
        (q.options||[]).forEach(o=>counts[o]=0);
        respList.forEach(([,res])=>{
          const ans=(res.answers||[])[qi];
          if(Array.isArray(ans)) ans.forEach(a=>{ if(counts[a]!==undefined) counts[a]++; });
          else if(ans&&counts[ans]!==undefined) counts[ans]++;
        });
        const total=respList.length||1;
        Object.entries(counts).forEach(([opt,cnt])=>{
          const pct=Math.round(cnt/total*100);
          const row=el('div',{style:'margin-bottom:8px;'});
          row.appendChild(el('div',{style:'display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;'},[
            el('span',{},[opt]),
            el('span',{style:'font-weight:700;'},[pct+'% ('+cnt+')']),
          ]));
          const bar=el('div',{style:'background:#e5e0d5;border-radius:4px;height:10px;overflow:hidden;'});
          bar.appendChild(el('div',{style:'background:var(--navy);height:100%;width:'+pct+'%;transition:width .5s;'}));
          row.appendChild(bar);
          qCard.appendChild(row);
        });
        copyLines.push('P'+(qi+1)+': '+q.text);
        Object.entries(counts).forEach(([opt,cnt])=>copyLines.push('  '+opt+': '+cnt+' ('+Math.round(cnt/(respList.length||1)*100)+'%)'));
        copyLines.push('');
      }
      r.appendChild(qCard);
    });

    if(!d.anonymous && respList.length>0){
      const detCard=el('div',{class:'card'});
      detCard.appendChild(el('h3',{},'Detalle por participante'));
      const tableWrap=el('div',{style:'overflow-x:auto;'});
      const table=el('table',{class:'results-table'});
      const thead=el('tr');
      thead.appendChild(el('th',{},'Nombre'));
      questions.forEach((_,qi)=> thead.appendChild(el('th',{},['P'+(qi+1)])));
      table.appendChild(thead);
      respList.forEach(([name,res])=>{
        const tr=el('tr');
        tr.appendChild(el('td',{},[name]));
        (res.answers||[]).forEach(a=> tr.appendChild(el('td',{},[Array.isArray(a)?a.join(', '):String(a||'—')])));
        table.appendChild(tr);
      });
      tableWrap.appendChild(table);
      detCard.appendChild(tableWrap);
      r.appendChild(detCard);
    }

    const copyBtn=el('button',{class:'copy-btn',style:'margin-bottom:16px;'},'Copiar resultados');
    copyBtn.addEventListener('click',()=>copyText(copyLines.join('\n')));
    r.appendChild(copyBtn);

    const backBtn=el('button',{class:'btn btn-outline',style:'margin-top:8px;margin-left:8px;'},['← Inicio']);
    backBtn.addEventListener('click',renderHome);
    r.appendChild(backBtn);
  });
}

function renderGuestSurvey(code, data, name){
  const questions=data.questions||[];
  let qi=0;
  const answers=[];

  function showSQ(){
    if(qi>=questions.length){ submitSurvey(); return; }
    clearRoot();
    const r=root();
    const hdr=el('div',{class:'act-header'});
    hdr.appendChild(el('span',{class:'act-header-title'},['📊 '+data.title]));
    hdr.appendChild(el('span',{class:'code-badge'},[code]));
    r.appendChild(hdr);

    r.appendChild(el('div',{class:'quiz-progress'},['Pregunta '+(qi+1)+' de '+questions.length]));

    const q=questions[qi];
    const card=el('div',{class:'quiz-q-card'});
    card.appendChild(el('div',{class:'quiz-q-text'},[q.text]));

    if(q.type==='open'){
      const ta=el('textarea',{placeholder:'Escribe tu respuesta...',style:'width:100%;padding:10px;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;font-family:inherit;min-height:80px;'});
      card.appendChild(ta);
      const nextBtn=el('button',{class:'btn btn-primary btn-full',style:'margin-top:12px;'},qi<questions.length-1?'Siguiente →':'Enviar');
      nextBtn.addEventListener('click',()=>{ answers.push(ta.value.trim()||''); qi++; showSQ(); });
      card.appendChild(nextBtn);
    } else {
      q.options.forEach(opt=>{
        const row=el('div',{class:'survey-opt-row'});
        const inp=el('input',{type:q.type==='multi'?'checkbox':'radio',name:'sq'+qi,value:opt,style:'accent-color:var(--navy);'});
        row.appendChild(inp);
        row.appendChild(el('span',{style:'font-size:14px;'},[opt]));
        row.addEventListener('click',()=>{ inp.checked=!inp.checked; });
        card.appendChild(row);
      });
      const nextBtn=el('button',{class:'btn btn-primary btn-full',style:'margin-top:12px;'},qi<questions.length-1?'Siguiente →':'Enviar');
      nextBtn.addEventListener('click',()=>{
        const checked=Array.from(card.querySelectorAll('input:checked')).map(i=>i.value);
        if(checked.length===0){ alert('Selecciona una opción.'); return; }
        answers.push(q.type==='multi'?checked:checked[0]);
        qi++; showSQ();
      });
      card.appendChild(nextBtn);
    }
    r.appendChild(card);
  }

  function submitSurvey(){
    const key=name?name:'anon_'+Date.now();
    sessionDoc.update({[`responses.${key}`]:{answers,submittedAt:Date.now()}}).catch(()=>{});
    clearRoot();
    const r=root();
    r.appendChild(el('div',{style:'text-align:center;padding:40px 20px;'},[
      el('div',{style:'font-size:48px;margin-bottom:16px;'},['✅']),
      el('div',{style:'font-size:20px;font-weight:700;color:var(--navy);'},'¡Respuestas enviadas!'),
      el('p',{class:'muted',style:'margin-top:8px;'},['Gracias por participar.']),
    ]));
  }

  showSQ();
}

function renderMarcadorHost(code, initialTeams){
  clearRoot();
  const r=root();
  const hdr=el('div',{class:'act-header'});
  hdr.appendChild(el('span',{class:'act-header-title'},['🏆 Marcador']));
  hdr.appendChild(el('span',{class:'code-badge'},[code]));
  r.appendChild(hdr);

  // Fase 1: Esperar alumnos
  const waitCard=el('div',{class:'card'});
  waitCard.appendChild(el('div',{class:'wt-label',style:'text-align:center;margin-bottom:8px;'},'Comparte el código'));
  waitCard.appendChild(el('div',{class:'big-code pulse',style:'text-align:center;'},[code]));

  const pWrap=el('div',{style:'margin-top:12px;text-align:center;'});
  pWrap.appendChild(el('p',{class:'muted',style:'margin-bottom:8px;'},'Alumnos conectados:'));
  const pList=el('div',{style:'display:flex;flex-wrap:wrap;justify-content:center;gap:6px;'});
  pWrap.appendChild(pList);
  waitCard.appendChild(pWrap);

  const lockBtn=el('button',{class:'btn btn-yellow btn-full',style:'margin-top:14px;'},'✓ Aceptar — cerrar registro');
  waitCard.appendChild(lockBtn);
  r.appendChild(waitCard);

  // Marcador (oculto hasta lock)
  const scoreSection=el('div',{style:'display:none;'});
  const cols=initialTeams.length<=4?initialTeams.length:2;
  const scoreGrid=el('div',{class:'score-grid',style:'grid-template-columns:repeat('+cols+',1fr);'});
  scoreSection.appendChild(scoreGrid);

  const finRow=el('div',{style:'margin-top:20px;display:flex;gap:10px;'});
  const finBtn=el('button',{class:'btn btn-danger'},'Fin — Ver ganador');
  finRow.appendChild(finBtn);
  scoreSection.appendChild(finRow);
  r.appendChild(scoreSection);

  let teams=initialTeams.map(t=>({...t}));
  let locked=false;

  function buildScoreGrid(){
    scoreGrid.innerHTML='';
    teams.forEach((team,i)=>{
      const tile=el('div',{class:'score-tile',style:'background:'+team.color+';'});
      tile.appendChild(el('div',{class:'team-label'},[team.name]));
      const numEl=el('div',{class:'score-num'},[String(team.score)]);
      tile.appendChild(numEl);
      tile.appendChild(el('div',{class:'score-hint'},['tap +1  •  doble tap -1']));

      let tapTimer=null;
      let tapCount=0;

      tile.addEventListener('click',()=>{
        tapCount++;
        if(tapTimer) clearTimeout(tapTimer);
        tapTimer=setTimeout(()=>{
          if(tapCount>=2){
            team.score=Math.max(0,team.score-1);
          } else {
            team.score++;
          }
          tapCount=0;
          numEl.textContent=String(team.score);
          syncMarcadorScores();
        },280);
      });

      scoreGrid.appendChild(tile);
    });
  }

  function syncMarcadorScores(){
    if(!sessionDoc) return;
    sessionDoc.update({teams:teams.map(t=>({name:t.name,color:t.color,score:t.score}))}).catch(()=>{});
  }

  lockBtn.addEventListener('click',async()=>{
    locked=true;
    await sessionDoc.update({locked:true});
    waitCard.style.display='none';
    scoreSection.style.display='';
    buildScoreGrid();
  });

  finBtn.addEventListener('click',async()=>{
    await sessionDoc.update({status:'finished',teams:teams.map(t=>({name:t.name,color:t.color,score:t.score}))});
    renderMarcadorResults(teams, null);
  });

  sessionListener=sessionDoc.onSnapshot(snap=>{
    if(!snap.exists) return;
    const d=snap.data();
    // Actualizar lista de participantes
    const participants=d.participants||{};
    pList.innerHTML='';
    Object.entries(participants).forEach(([name,info])=>{
      const teamName=info.team||'—';
      const teamObj=teams.find(t=>t.name===teamName);
      const color=teamObj?teamObj.color:var_navy;
      const chip=el('span',{style:'background:'+color+';color:#fff;padding:3px 10px;border-radius:20px;font-size:12px;'},[name+' ('+teamName+')']);

    if(d.teams && locked){
      d.teams.forEach((dt,i)=>{ if(teams[i]) teams[i].score=dt.score; });
      buildScoreGrid();
    }
  });
}

const var_navy='#293379';

function renderMarcadorResults(teams, myTeamName){
  const sorted=[...teams].sort((a,b)=>b.score-a.score);
  const winner=sorted[0];
  const isWinner=myTeamName ? winner.name===myTeamName : null;

  // Limpiar overlay existente
  const overlay=document.getElementById('endgameOverlay');
  const confettiCanvas=document.getElementById('confettiCanvas');

  document.getElementById('endgameEmoji').textContent=isWinner===null?'🏆':(isWinner?'🎉':'💪');
  document.getElementById('endgameTitle').textContent=
    isWinner===null ? winner.name+' gana!'
    : isWinner ? '¡Lo lograste!' : 'Suerte para la próxima';
  document.getElementById('endgameSub').textContent=
    isWinner===null ? sorted.map((t,i)=>(i+1)+'. '+t.name+': '+t.score+' pts').join('  |  ')
    : isWinner ? '¡Tu equipo, '+myTeamName+', ganó con '+winner.score+' puntos!'
    : 'El equipo '+winner.name+' ganó con '+winner.score+' puntos.';

  overlay.style.background=isWinner===null?'linear-gradient(135deg,#1a2060,#293379)'
    : isWinner ? 'linear-gradient(135deg,#16a34a,#0d9488)'
    : 'linear-gradient(135deg,#374151,#1f2937)';

  overlay.classList.add('show');

  document.getElementById('endgameBtn').onclick=()=>{
    overlay.classList.remove('show');
    stopSession();
    renderHome();
  };

  if(isWinner){
    launchConfetti(confettiCanvas);
  }
}

function launchConfetti(canvas){
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  const pieces=Array.from({length:120},()=>({
    x:Math.random()*canvas.width,
    y:-20,
    w:Math.random()*10+4,
    h:Math.random()*6+3,
    color:['#f5c518','#293379','#16a34a','#dc2626','#9333ea'][Math.floor(Math.random()*5)],
    vy:Math.random()*3+2,
    vx:(Math.random()-.5)*2,
    rot:Math.random()*360,
    drot:(Math.random()-.5)*8,
    opacity:1
  }));
  let frame;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    pieces.forEach(p=>{
      p.y+=p.vy; p.x+=p.vx; p.rot+=p.drot;
      if(p.y>canvas.height) p.opacity-=0.05;
      if(p.opacity>0){
        alive=true;
        ctx.save();
        ctx.globalAlpha=Math.max(0,p.opacity);
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle=p.color;
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx.restore();
      }
    });
    if(alive) frame=requestAnimationFrame(draw);
  }
  frame=requestAnimationFrame(draw);
}

/* ═══════════════════════════════════════════════════════
   PLANO CARTESIANO — Host
═══════════════════════════════════════════════════════ */
function drawPlanoSVG(pairs, interactive, onPlacePoint){
  const SIZE=400;
  const HALF=SIZE/2;
  const CELL=SIZE/20; // 20 units total (-10 to 10)

  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('width',SIZE);
  svg.setAttribute('height',SIZE);
  svg.setAttribute('viewBox','0 0 '+SIZE+' '+SIZE);
  svg.setAttribute('class','plano-svg');
  svg.style.maxWidth='100%';

  function toSvgX(x){ return HALF + x*CELL; }
  function toSvgY(y){ return HALF - y*CELL; }
  function fromSvgCoord(sx,sy){
    const x=Math.round((sx-HALF)/CELL);
    const y=Math.round((HALF-sy)/CELL);
    return {x,y};
  }

  // Grid lines
  for(let i=-10;i<=10;i++){
    const lv=document.createElementNS(svgNS,'line');
    lv.setAttribute('x1',toSvgX(i));lv.setAttribute('y1',0);
    lv.setAttribute('x2',toSvgX(i));lv.setAttribute('y2',SIZE);
    lv.setAttribute('stroke','#ddd');lv.setAttribute('stroke-width','0.5');
    svg.appendChild(lv);
    const lh=document.createElementNS(svgNS,'line');
    lh.setAttribute('x1',0);lh.setAttribute('y1',toSvgY(i));
    lh.setAttribute('x2',SIZE);lh.setAttribute('y2',toSvgY(i));
    lh.setAttribute('stroke','#ddd');lh.setAttribute('stroke-width','0.5');
    svg.appendChild(lh);
  }

  // Axes
  const ax=document.createElementNS(svgNS,'line');
  ax.setAttribute('x1',0);ax.setAttribute('y1',HALF);ax.setAttribute('x2',SIZE);ax.setAttribute('y2',HALF);
  ax.setAttribute('stroke','#293379');ax.setAttribute('stroke-width','2');
  svg.appendChild(ax);
  const ay=document.createElementNS(svgNS,'line');
  ay.setAttribute('x1',HALF);ay.setAttribute('y1',0);ay.setAttribute('x2',HALF);ay.setAttribute('y2',SIZE);
  ay.setAttribute('stroke','#293379');ay.setAttribute('stroke-width','2');
  svg.appendChild(ay);

  // Axis labels
  [-10,-5,5,10].forEach(n=>{
    const tx=document.createElementNS(svgNS,'text');
    tx.setAttribute('x',toSvgX(n));tx.setAttribute('y',HALF+14);
    tx.setAttribute('text-anchor','middle');tx.setAttribute('font-size','10');tx.setAttribute('fill','#6b7280');
    tx.textContent=n;
    svg.appendChild(tx);
    const ty=document.createElementNS(svgNS,'text');
    ty.setAttribute('x',HALF-14);ty.setAttribute('y',toSvgY(n)+4);
    ty.setAttribute('text-anchor','middle');ty.setAttribute('font-size','10');ty.setAttribute('fill','#6b7280');
    ty.textContent=n;
    svg.appendChild(ty);
  });

  // Axis arrow tips
  const arrowPaths=[
    'M '+SIZE+','+HALF+' L '+(SIZE-8)+','+(HALF-5)+' L '+(SIZE-8)+','+(HALF+5),
    'M '+HALF+',0 L '+(HALF-5)+',8 L '+(HALF+5)+',8'
  ];
  arrowPaths.forEach(d=>{
    const p=document.createElementNS(svgNS,'path');
    p.setAttribute('d',d);p.setAttribute('fill','#293379');
    svg.appendChild(p);
  });

  // Plot existing pairs
  (pairs||[]).forEach(pair=>{
    const match=pair.coord.match(/\(?\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\)?/);
    if(!match) return;
    const px=parseFloat(match[1]),py=parseFloat(match[2]);
    const cx=toSvgX(px), cy2=toSvgY(py);
    const c=document.createElementNS(svgNS,'circle');
    c.setAttribute('cx',cx);c.setAttribute('cy',cy2);c.setAttribute('r','7');
    c.setAttribute('fill',pair.color||'#293379');c.setAttribute('stroke','#fff');c.setAttribute('stroke-width','2');
    svg.appendChild(c);
    const t=document.createElementNS(svgNS,'text');
    t.setAttribute('x',cx+10);t.setAttribute('y',cy2-8);
    t.setAttribute('font-size','12');t.setAttribute('font-weight','bold');t.setAttribute('fill',pair.color||'#293379');
    t.textContent=pair.label;
    svg.appendChild(t);
  });

  // Interactive click handler
  if(interactive && onPlacePoint){
    svg.addEventListener('click',e=>{
      const rect=svg.getBoundingClientRect();
      const scaleX=SIZE/rect.width, scaleY=SIZE/rect.height;
      const sx=(e.clientX-rect.left)*scaleX;
      const sy=(e.clientY-rect.top)*scaleY;
      const coord=fromSvgCoord(sx,sy);
      if(coord.x<-10||coord.x>10||coord.y<-10||coord.y>10) return;
      onPlacePoint(coord);
    });
  }

  return svg;
}

          td.textContent=ap.studentAnswer||'—';
          row.appendChild(td);
        });
        row.appendChild(el('td',{style:'font-weight:700;'},[correct+'/'+(ans.pairs||[]).length]));
        tbody.appendChild(row);
      });
      tbl.appendChild(tbody);
      table.appendChild(tbl);
    });
  });
  r.appendChild(startBtn);

  const finBtn=el('button',{class:'btn btn-outline btn-sm',style:'margin-top:8px;display:block;'},'Finalizar sesión');
  finBtn.addEventListener('click',()=>{ sessionDoc.update({status:'finished'}).catch(()=>{}); renderHome(); });

}

      }));
      svgWrap.innerHTML='';
      const newSvg=drawPlanoSVG(placed, true, null);
      newSvg.addEventListener('click', function onC(e){
        if(currentPairIdx>=pairs.length) return;
        const rect=newSvg.getBoundingClientRect();
        const scaleX=400/rect.width, scaleY=400/rect.height;
        const sx=(e.clientX-rect.left)*scaleX;
        const sy=(e.clientY-rect.top)*scaleY;
        const cx2=Math.round((sx-200)/20);
        const cy3=Math.round((200-sy)/20);
        if(cx2<-10||cx2>10||cy3<-10||cy3>10) return;
        const pp=pairs[currentPairIdx];
        placedPoints[currentPairIdx]={x:cx2,y:cy3};
        studentAnswers[currentPairIdx].studentAnswer='('+cx2+', '+cy3+')';
        const se=document.getElementById('planoStatus'+currentPairIdx);
        if(se) se.textContent='→ ('+cx2+', '+cy3+')';
        currentPairIdx++;
        const pl2=Object.entries(placedPoints).map(([idx2,c2])=>({
          coord:'('+c2.x+','+c2.y+')',label:pairs[idx2].label,color:pairs[idx2].color
        }));
        svgWrap.innerHTML='';
        svgWrap.appendChild(drawPlanoSVG(pl2, currentPairIdx<pairs.length, null));
      });
      svgWrap.appendChild(newSvg);
    });
    svgWrap.appendChild(svgEl);
    r.appendChild(svgWrap);
    r.appendChild(el('p',{class:'muted',style:'margin-bottom:12px;font-size:12px;'},'Haz clic en el plano para colocar cada punto en orden.'));
  }

  const finBtn=el('button',{class:'btn btn-primary btn-full',style:'margin-top:20px;'},'Finalizar');
  finBtn.addEventListener('click',async()=>{
    // Check answers
    studentAnswers.forEach(sa=>{
      const match=sa.coord.match(/\(?\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\)?/);
      const matchStu=sa.studentAnswer.match(/\(?\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\)?/);
      if(match && matchStu){
        sa.correct=(parseFloat(match[1])===parseFloat(matchStu[1]) && parseFloat(match[2])===parseFloat(matchStu[2]));
      } else { sa.correct=false; }
    });
    const correct=studentAnswers.filter(s=>s.correct).length;
    await sessionDoc.update({[`answers.${name}`]:{pairs:studentAnswers,ts:Date.now()}});

    // Show score overlay
    clearRoot();
    const o=root();
    o.appendChild(el('div',{style:'text-align:center;padding:40px 20px;'},[
      el('div',{style:'font-size:64px;margin-bottom:16px;'},['📐']),
      el('h2',{style:'font-size:28px;color:var(--navy);margin-bottom:8px;'},[correct+'/'+pairs.length+' correctas']),
      el('p',{class:'muted',style:'font-size:15px;margin-bottom:24px;'},['¡Actividad completada!']),
      el('button',{class:'btn btn-primary',onclick:()=>renderHome()},'Volver al inicio')
    ]));
  });
  r.appendChild(finBtn);
}

/* ═══════════════════════════════════════════════════════
   ORDEN — Host

function renderOrdenHost(code){
  clearRoot();
  const r=root();

  const hdr=el('div',{class:'act-header'});
  hdr.appendChild(el('span',{class:'act-header-title'},['🔢 Orden']));
  hdr.appendChild(el('span',{class:'code-badge'},[code]));
  r.appendChild(hdr);

  let questions=[];

  const questionsWrap=el('div',{id:'ordenQuestionsWrap'});
  r.appendChild(questionsWrap);

  function rebuildQuestions(){
    questionsWrap.innerHTML='';
    questions.forEach((q,qi)=>{
      const card=el('div',{class:'orden-question-card'});
      const topRow=el('div',{style:'display:flex;align-items:center;gap:10px;margin-bottom:10px;'});
      topRow.appendChild(el('span',{style:'font-weight:700;color:var(--navy);flex:0 0 auto;'},['Pregunta '+(qi+1)+':']));
      const promptIn=el('input',{type:'text',placeholder:'Instrucción o pregunta...',
        style:'flex:1;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;font-family:inherit;',
        value:q.prompt});
      promptIn.addEventListener('input',()=>q.prompt=promptIn.value);
      topRow.appendChild(promptIn);
      const delQ=el('button',{class:'btn btn-danger btn-sm'},'Eliminar');
      delQ.addEventListener('click',()=>{ questions.splice(qi,1); rebuildQuestions(); });
      topRow.appendChild(delQ);
      card.appendChild(topRow);

      card.appendChild(el('p',{class:'muted',style:'font-size:12px;margin-bottom:8px;'},'Agrega las casillas y ordénalas (el orden final es el correcto):'));

      // Items list with drag
      const itemsWrap=el('div',{class:'orden-cards-row',id:'ordenItems_'+qi});

      function renderItems(){
        itemsWrap.innerHTML='';
        q.items.forEach((item,ii)=>{
          const card2=el('div',{class:'orden-card-item',draggable:'true'});
          card2.textContent=item;
          card2.setAttribute('data-idx',ii);
          card2.addEventListener('dragstart',e=>{
            e.dataTransfer.setData('text/plain',ii);
            card2.classList.add('dragging');
          });
          card2.addEventListener('dragend',()=>card2.classList.remove('dragging'));
          card2.addEventListener('dragover',e=>{
            e.preventDefault();
            card2.classList.add('drag-over');
          });
          card2.addEventListener('dragleave',()=>card2.classList.remove('drag-over'));
          card2.addEventListener('drop',e=>{
            e.preventDefault();
            card2.classList.remove('drag-over');
            const fromIdx=parseInt(e.dataTransfer.getData('text/plain'));
            const toIdx=ii;
            if(fromIdx===toIdx) return;
            const moved=q.items.splice(fromIdx,1)[0];
            q.items.splice(toIdx,0,moved);
            renderItems();
          });
          const delI=el('button',{style:'background:rgba(255,255,255,.3);border:none;color:#fff;border-radius:4px;padding:2px 6px;cursor:pointer;margin-left:6px;font-size:11px;'},['×']);
          delI.addEventListener('click',e=>{ e.stopPropagation(); q.items.splice(ii,1); renderItems(); });
          card2.appendChild(delI);
          itemsWrap.appendChild(card2);
        });
      }
      renderItems();
      card.appendChild(itemsWrap);

      const addItemRow=el('div',{style:'display:flex;gap:6px;margin-top:8px;'});
      const itemIn=el('input',{type:'text',placeholder:'Texto de la casilla...',
        style:'flex:1;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;font-size:13px;font-family:inherit;'});
      const addItemBtn=el('button',{class:'btn btn-yellow btn-sm'},'Agregar casilla');
      addItemBtn.addEventListener('click',()=>{
        const v=itemIn.value.trim(); if(!v) return;
        q.items.push(v); itemIn.value=''; renderItems();
      });
      itemIn.addEventListener('keydown',e=>{ if(e.key==='Enter') addItemBtn.click(); });
      addItemRow.appendChild(itemIn);
      addItemRow.appendChild(addItemBtn);
      card.appendChild(addItemRow);

      questionsWrap.appendChild(card);
    });
  }
  rebuildQuestions();

  const addQBtn=el('button',{class:'btn btn-outline',style:'margin-bottom:16px;'},'+ Agregar pregunta');
  addQBtn.addEventListener('click',()=>{
    questions.push({id:'q'+Date.now(),prompt:'',items:[]});
    rebuildQuestions();
  });
  r.appendChild(addQBtn);

  // Results
  const resultsCard=el('div',{class:'card',style:'display:none;',id:'ordenResults'});
  resultsCard.appendChild(el('h3',{},'Resultados'));
  const resultsTable=el('div',{id:'ordenResultsTable'});
  resultsCard.appendChild(resultsTable);
  r.appendChild(resultsCard);

  const startBtn=el('button',{class:'btn btn-primary btn-full',style:'margin-top:8px;'},'Iniciar actividad');
  startBtn.addEventListener('click',async()=>{
    if(questions.length===0){ alert('Agrega al menos una pregunta.'); return; }
    for(let q of questions){
      if(q.items.length<2){ alert('Cada pregunta necesita al menos 2 casillas.'); return; }
    }
    await sessionDoc.set({
      tool:'orden',
      code,
      questions:questions.map(q=>({id:q.id,prompt:q.prompt,items:[...q.items]})),
      status:'active',
      createdAt:Date.now(),
      participants:{},
      answers:{}
    });
    startBtn.style.display='none';
    addQBtn.style.display='none';
    document.getElementById('ordenResults').style.display='';

    sessionListener=sessionDoc.onSnapshot(snap=>{
      if(!snap.exists) return;
      const d=snap.data();
      const answers=d.answers||{};
      const qs=d.questions||[];
      const tbl=document.getElementById('ordenResultsTable');
      if(!tbl) return;
      tbl.innerHTML='';
      if(Object.keys(answers).length===0){
        tbl.appendChild(el('p',{class:'muted',style:'text-align:center;padding:20px;'},'Esperando respuestas...'));
        return;
      }
      const table=el('table',{class:'results-table'});
      const thead=el('thead');
      const hrow=el('tr');
      hrow.appendChild(el('th',{},'Alumno'));
      qs.forEach((q,i)=>hrow.appendChild(el('th',{},['P'+(i+1)])));
      hrow.appendChild(el('th',{},'Total'));
      thead.appendChild(hrow);
      table.appendChild(thead);
      const tbody=el('tbody');
      Object.entries(answers).forEach(([name,ans])=>{
        const row=el('tr');
        row.appendChild(el('td',{style:'font-weight:700;'},[name]));
        let total=0;
        (ans||[]).forEach((a,i)=>{
          const q=qs[i];
          const correct=JSON.stringify(a.order)===JSON.stringify(q?q.items:[]);
          if(correct) total++;
          row.appendChild(el('td',{style:'color:'+(correct?'var(--success)':'var(--danger)')+';text-align:center;'},[correct?'✓':'✗']));
        });
        row.appendChild(el('td',{style:'font-weight:700;text-align:center;'},[total+'/'+(ans||[]).length]));
        tbody.appendChild(row);
      });
      table.appendChild(tbody);
      tbl.appendChild(table);
    });
  });
  r.appendChild(startBtn);

  const finBtn=el('button',{class:'btn btn-outline btn-sm',style:'margin-top:8px;display:block;'},'Finalizar sesión');
  finBtn.addEventListener('click',()=>{ sessionDoc.update({status:'finished'}).catch(()=>{}); renderHome(); });
  r.appendChild(finBtn);
}

/* ── GUEST ORDEN ── */
function renderGuestOrden(code, data, name){
  clearRoot();
  const r=root();

  const hdr=el('div',{class:'act-header'});
  hdr.appendChild(el('span',{class:'act-header-title'},['🔢 Orden']));
  hdr.appendChild(el('span',{class:'code-badge'},[code]));
  r.appendChild(hdr);

  const questions=data.questions||[];

  // Shuffle items for each question
  const studentOrders=questions.map(q=>{
    const shuffled=[...q.items].sort(()=>Math.random()-.5);
    return {qId:q.id,order:shuffled};
  });

  function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }

  questions.forEach((q,qi)=>{
    const card=el('div',{class:'orden-question-card'});
    card.appendChild(el('div',{class:'orden-q-prompt'},[q.prompt||('Pregunta '+(qi+1))]));

    const itemsRow=el('div',{class:'orden-cards-row',id:'gOrdenRow_'+qi});

    function renderGuestItems(){
      itemsRow.innerHTML='';
      studentOrders[qi].order.forEach((item,ii)=>{
        const c=el('div',{class:'orden-card-item',draggable:'true'});
        c.textContent=item;
        c.setAttribute('data-idx',ii);

        // Desktop drag
        c.addEventListener('dragstart',e=>{
          e.dataTransfer.setData('text/plain',ii);
          c.classList.add('dragging');
        });
        c.addEventListener('dragend',()=>c.classList.remove('dragging'));
        c.addEventListener('dragover',e=>{ e.preventDefault(); c.classList.add('drag-over'); });
        c.addEventListener('dragleave',()=>c.classList.remove('drag-over'));
        c.addEventListener('drop',e=>{
          e.preventDefault(); c.classList.remove('drag-over');
          const fromIdx=parseInt(e.dataTransfer.getData('text/plain'));
          const toIdx=ii;
          if(fromIdx===toIdx) return;
          const moved=studentOrders[qi].order.splice(fromIdx,1)[0];
          studentOrders[qi].order.splice(toIdx,0,moved);
          renderGuestItems();
        });

        // Touch support
        let touchStartIdx=null;
        c.addEventListener('touchstart',e=>{
          touchStartIdx=ii;
          c.classList.add('dragging');
        });
        c.addEventListener('touchend',e=>{
          c.classList.remove('dragging');
          const touch=e.changedTouches[0];
          const target=document.elementFromPoint(touch.clientX,touch.clientY);
          const targetCard=target && target.closest('.orden-card-item');
          if(targetCard && targetCard!==c){
            const toIdx2=parseInt(targetCard.getAttribute('data-idx'));
            if(!isNaN(toIdx2) && toIdx2!==touchStartIdx){
              const moved=studentOrders[qi].order.splice(touchStartIdx,1)[0];
              studentOrders[qi].order.splice(toIdx2,0,moved);
              renderGuestItems();
            }
          }
          touchStartIdx=null;
        });

        itemsRow.appendChild(c);
      });
    }
    renderGuestItems();
    card.appendChild(itemsRow);
    r.appendChild(card);
  });

  const finBtn=el('button',{class:'btn btn-primary btn-full',style:'margin-top:16px;'},'Finalizar');
  finBtn.addEventListener('click',async()=>{
    // Compute score
    let correct=0;
    studentOrders.forEach((so,i)=>{
      if(JSON.stringify(so.order)===JSON.stringify(questions[i].items)) correct++;
    });
    await sessionDoc.update({[`answers.${name}`]:studentOrders,[`participants.${name}`]:{done:true,ts:Date.now()}});

    clearRoot();
    const o=root();
    o.appendChild(el('div',{style:'text-align:center;padding:40px 20px;'},[
      el('div',{style:'font-size:64px;margin-bottom:16px;'},['🔢']),
      el('h2',{style:'font-size:28px;color:var(--navy);margin-bottom:8px;'},[correct+'/'+questions.length+' correctas']),
      el('p',{class:'muted',style:'font-size:15px;margin-bottom:24px;'},['¡Actividad completada!']),
      el('button',{class:'btn btn-primary',onclick:()=>renderHome()},'Volver al inicio')
    ]));
  });
  r.appendChild(finBtn);
}
